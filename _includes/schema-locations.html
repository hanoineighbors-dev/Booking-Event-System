<script type="application/ld+json">
[
{%- for loc in site.data.locations %}
  {
    "@context": "https://schema.org",
    "@type": "CafeOrCoffeeShop",
    "name": {{ loc.name | jsonify }},
    "url": {{ site.url | append: "/" | jsonify }},
    "image": {{ site.image | absolute_url | jsonify }},
    "address": {
      "@type": "PostalAddress",
      "streetAddress": {{ loc.street | jsonify }},
      "addressLocality": "Hà Nội",
      "addressCountry": "VN"
    },
    "hasMap": {{ loc.map | jsonify }}
  }{% unless forloop.last %},{% endunless %}
{%- endfor %}
]
</script>
