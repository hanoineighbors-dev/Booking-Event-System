disabled = true;\n  btn.innerHTML = '<span class=\"spinner\"><\u002Fspan> ' + tr('sending');\n\n  \u002F\u002F Sync lại trước khi gửi để tránh đặt trùng\n  await syncFromSheet();\n  const taken = takenIds(State.date);\n  \u002F\u002F Conflict check: non-communal nếu trong taken; communal nếu không đủ chỗ\n  const conflict = State.selectedTableIds.find(id => {\n    const t = getTable(id);\n    if (!t) return false;\n    if (t.communal) {\n      \u002F\u002F Bàn chung: chỉ cần đủ chỗ cho số ghế tôi đặt ở bàn ĐÓ (không phải qty toàn bộ).\n      \u002F\u002F Khách qty=2 chia 1 ghế A2 + 1 ghế A3 → mỗi bàn chỉ cần 1 chỗ trống.\n      const myPicks = Number(State.communalPicks[id] || 0);\n      return myPicks > 0 && remainingCommunal(id, State.date) < myPicks;\n    }\n    return taken.has(id);\n  });\n  if (conflict) {\n    const ct = getTable(conflict);\n    const msg = ct && ct.communal\n      ? tr('conflict_communal', { name: ct.name })\n      : tr('conflict_table', { name: (ct ? ct.name : conflict) });\n    toast(msg, 'err', 5000);\n    btn.disabled = false;\n    btn.textContent = tr('submit_btn');\n    goStep(3);\n    return;\n  }\n\n  const ev = State.events.find(e => e.id === State.date);\n  let code = State._previewCode || genCode();\n  \u002F\u002F tableNames hiển thị trong email\u002Fsheet:\n  \u002F\u002F   - Communal: \"2 ghế A2 (Khu A)\" để admin thấy rõ số ghế\n  \u002F\u002F   - Non-communal: \"A1 (Khu A)\"\n  const tableNames = State.selectedTableIds.map(id => {\n    const t = getTable(id);\n    if (t && t.communal) {\n      const n = Number(State.communalPicks[id] || 0);\n      return n + ' ghế ' + t.name + ' (' + t.room + ')';\n    }\n    return t.name + ' (' + t.room + ')';\n  });\n  \u002F\u002F Build communalSeats payload — lấy trực tiếp từ State.communalPicks ({A2: 2, A3: 1}).\n  \u002F\u002F Backend dùng dict này để check capacity + render email confirm.\n  const communalSeats = {};\n  Object.keys(State.communalPicks || {}).forEach(id => {\n    const n = Number(State.communalPicks[id] || 0);\n    if (n > 0) communalSeats[id] = n;\n  });\n\n  \u002F\u002F Build menuSnapshot — cấu trúc khớp với backend formatGuestLine() và appendGuestRow().\n  \u002F\u002F Khi admin sửa Menus sheet sau, email xác nhận vẫn render đúng menu khách đã chọn.\n  const menuNow = getEventMenu(State.date);\n  \u002F\u002F Drinks giống nhau giữa các set (model chung) — gắn vào mỗi set để BE tìm theo set+drinkId.\n  const snapshotDrinks = (menuNow.drinks || []).map(d => ({\n    itemId: d.id,\n    itemName: d.label,\n    tag: d.type === 'cocktail' ? 'alcohol' : 'zeroproof',\n  }));\n  const menuSnapshot = {\n    sets: (menuNow.sets || []).map(s => ({\n      id: String(s.id).toUpperCase(),\n      starter: menuNow.sharedStarter ? { itemName: menuNow.sharedStarter } : null,\n      main: { itemName: s.mainDish || '' },\n      dessert: menuNow.sharedDessert ? { itemName: menuNow.sharedDessert } : null,\n      drinks: snapshotDrinks,\n    })),\n  };\n\n  \u002F\u002F Guests format: \"A:drinkId\" — set ID 1 ký tự uppercase đồng bộ với BE.\n  const guestsPayload = State.guestSelections.map(g => {\n    const setId = (g.set || '').toUpperCase();\n    return setId + (g.drink ? ':' + g.drink : '');\n  });\n\n  const booking = {\n    code, eventId: State.date, eventLabel: ev.label,\n    tableIds: State.selectedTableIds, tableNames,\n    comboLabel: tableNames.join(' + '),\n    qty: State.qty,\n    guests: guestsPayload,\n    menuSnapshot,\n    communalSeats,\n    total: getTotal(), name: State.name,\n    phone: State.phone, email: State.email, note: State.note, ref: State.ref,\n    status: 'pending', createdAt: new Date().toISOString(),\n  };\n\n  savePendingLocal(booking);\n  let serverOk = false;\n  if (hasSheetUrl()) {\n    let res = await api('pending', booking, { method: 'POST' });\n    \u002F\u002F Retry 1 lần nếu trúng collision code: regenerate và gửi lại.\n    if (res && res.ok === false && res.error === 'code collision') {\n      code = genCode();\n      State.ref = genPaymentRef(code);\n      booking.code = code;\n      booking.ref = State.ref;\n      res = await api('pending', booking, { method: 'POST' });\n    }\n    serverOk = res && res.ok === true;\n    if (!serverOk) {\n      toast(tr('toast_sync_err'), 'warn', 6000);\n    }\n  }\n\n  \u002F\u002F Update local state để UI khoá bàn ngay\n  State.pending.push(booking);\n\n  \u002F\u002F Show success\n  $('ok-code').textContent = code;\n  State.step = 'success';\n  State._successCreatedAt = booking.createdAt;\n  startCountdown(booking.createdAt);\n  for (let i = 1; i <= 4; i++) {\n    const el = $('s'+i); el.classList.remove('a'); el.classList.add('d');\n  }\n  ['step-1','step-2','step-3','step-4'].forEach(id => $(id).classList.add('hidden'));\n  const s = $('step-success');\n  s.classList.remove('hidden'); setTimeout(() => s.classList.add('fade'), 10);\n  toast(serverOk ? tr('toast_sent') : tr('toast_saved'), serverOk ? 'ok' : 'warn');\n}\n\n\u002F\u002F Format thời gian còn lại: \"5 giờ 23 phút\" \u002F \"45 phút\" \u002F \"12 phút 30 giây\" tuỳ độ dài.\nfunction formatRemainTime(ms) {\n  if (ms <= 0) return tr('zero_min');\n  const totalSec = Math.floor(ms \u002F 1000);\n  const h = Math.floor(totalSec \u002F 3600);\n  const m = Math.floor((totalSec % 3600) \u002F 60);\n  const s = totalSec % 60;\n  if (h > 0) return h + ' ' + tr('unit_hour') + ' ' + m + ' ' + tr('unit_min');\n  if (m > 0) return m + ' ' + tr('unit_min') + (m < 10 ? ' ' + s + ' ' + tr('unit_sec') : '');\n  return s + ' ' + tr('unit_sec');\n}\n\nfunction startCountdown(createdAt) {\n  if (State.countdownTimer) clearInterval(State.countdownTimer);\n  const expireAt = new Date(createdAt).getTime() + CONFIG.PENDING_TTL_MIN * 60 * 1000;\n  function tick() {\n    const remain = expireAt - Date.now();\n    if (remain <= 0) {\n      $('ok-countdown').textContent = tr('countdown_expired');\n      clearInterval(State.countdownTimer); return;\n    }\n    $('ok-countdown').textContent = tr('countdown_left', { time: formatRemainTime(remain) });\n  }\n  tick();\n  \u002F\u002F Tick 30s\u002Flần là đủ với TTL 8h (không cần tick mỗi giây).\n  State.countdownTimer = setInterval(tick, 30000);\n}\n\n\u002F\u002F === CHECK STATUS ===============================================\n\u002F\u002F Render block chi tiết booking (ngày + bàn + qty + tổng tiền). Dùng cho cả pending và confirmed.\nfunction statusDetailHtml(b) {\n  const lines = [];\n  if (b.eventLabel) lines.push([tr('date_lbl'), escapeHtml(b.eventLabel)]);\n  if (b.comboLabel) lines.push([tr('table_lbl'), escapeHtml(b.comboLabel)]);\n  if (b.qty)        lines.push([tr('guests_lbl'), escapeHtml(String(b.qty)) + ' ' + tr('people')]);\n  if (b.total)      lines.push([tr('amount_lbl'), fmt(b.total)]);\n  if (b.note)       lines.push([tr('note_lbl'), escapeHtml(b.note)]);\n  if (!lines.length) return '';\n  return '<div class=\"status-detail\">' + lines.map(([l, v]) =>\n    '<div class=\"sd-row\"><span class=\"sd-lbl\">' + l + '<\u002Fspan><span class=\"sd-val\">' + v + '<\u002Fspan><\u002Fdiv>'\n  ).join('') + '<\u002Fdiv>';\n}\n\nasync function checkStatus(codeArg) {\n  const code = (codeArg || $('check-code').value).trim().toUpperCase();\n  $('check-code').value = code;\n  const resultEl = $('status-result');\n  if (!code) return;\n\n  resultEl.classList.remove('hidden');\n  resultEl.className = 'status-result status-notfound';\n  resultEl.textContent = tr('checking');\n\n  await syncFromSheet();\n  const confirmed = State.confirmed.find(b => b.code === code);\n  if (confirmed) {\n    resultEl.className = 'status-result status-confirmed';\n    resultEl.innerHTML = tr('status_confirmed') +\n      statusDetailHtml(confirmed);\n    return;\n  }\n  \u002F\u002F Ưu tiên pending từ localStorage (có đủ data cá nhân của khách); fallback từ server publicView.\n  const pendingLocal = loadPendingLocal().find(b => b.code === code);\n  const pendingServer = State.pending.find(b => b.code === code);\n  const pending = pendingLocal || pendingServer;\n  if (pending && !isExpired(pending)) {\n    const ageMs = Date.now() - new Date(pending.createdAt).getTime();\n    const remainMs = Math.max(0, CONFIG.PENDING_TTL_MIN * 60 * 1000 - ageMs);\n    resultEl.className = 'status-result status-pending';\n    resultEl.innerHTML = '<b>' + tr('status_pending') + '<\u002Fb> ' + tr('code_lbl') + ': ' + escapeHtml(code) +\n      '<br>' + tr('status_pending_msg', { time: formatRemainTime(remainMs) }) +\n      statusDetailHtml(pending) +\n      '<br><button class=\"btn-cancel-mini\" data-action=\"cancel-booking\" data-code=\"' + escapeHtml(code) + '\">' + tr('cancel_this') + '<\u002Fbutton>';\n    return;\n  }\n  if (pending && isExpired(pending)) {\n    resultEl.className = 'status-result status-cancelled';\n    resultEl.innerHTML = tr('status_expired', { code: escapeHtml(code), h: (CONFIG.PENDING_TTL_MIN \u002F 60) });\n    return;\n  }\n  resultEl.className = 'status-result status-notfound';\n  resultEl.innerHTML = tr('status_notfound', { code: escapeHtml(code) });\n}\n\nasync function cancelBooking(code) {\n  const ok = await modalConfirm({\n    title: tr('cancel_title', { code: code }),\n    body: tr('cancel_body'),\n    confirmText: tr('cancel_confirm'),\n    cancelText: tr('cancel_dismiss'),\n    danger: true,\n  });\n  if (!ok) return;\n  const phone = await modalPrompt({\n    title: tr('verify_title'),\n    body: tr('verify_body'),\n    placeholder: tr('verify_ph'),\n    inputType: 'tel',\n    okText: tr('verify_ok'),\n  });\n  if (!phone) return;\n  const res = await api('cancel', { code, phoneLast4: phone }, { method: 'POST' });\n  if (res && res.ok) {\n    toast(tr('toast_cancelled', { code: code }), 'ok');\n    \u002F\u002F Cập nhật local\n    localStorage.setItem(CONFIG.KEY_PENDING_LOCAL,\n      JSON.stringify(loadPendingLocal().filter(b => b.code !== code)));\n    await syncFromSheet();\n    renderDates();\n    checkStatus(code);\n  } else {\n    toast(tr('toast_cancel_fail', { err: (res && res.error) || tr('err_unknown') }), 'err');\n  }\n}\n\n\u002F\u002F === FLOW =======================================================\nfunction goStep(n) {\n  ['step-1','step-2','step-3','step-4','step-success'].forEach(id => {\n    const el = $(id); el.classList.add('hidden'); el.classList.remove('fade');\n  });\n  for (let i = 1; i <= 4; i++) {\n    const el = $('s'+i); el.classList.remove('a','d');\n    if (i < n) el.classList.add('d'); else if (i === n) el.classList.add('a');\n  }\n  const el = $('step-' + n);\n  el.classList.remove('hidden');\n  setTimeout(() => el.classList.add('fade'), 10);\n  const prev = State.step;\n  State.prevStep = prev;\n  State.step = n;\n  if (n === 2) updateQtyHint();\n  if (n === 3) {\n    \u002F\u002F Chỉ reset selection khi đi tới (từ step ≤ 2). Khi back từ step 4, giữ nguyên bàn đã chọn.\n    if (prev < 3) {\n      State.selectedTableIds = [];\n      State.communalPicks = {};\n    }\n    updateMapStates();\n    \u002F\u002F Hint scroll cho mobile: animate preview lần đầu user vào step 3 trong session.\n    autoScrollPreview();\n  }\n  if (n === 4) { renderStep4Menu(); validateForm(); }\n  window.scrollTo({ top: 0, behavior: 'smooth' });\n}\n\nfunction resetBooking() {\n  Object.assign(State, {\n    step: 1, prevStep: 1, date: null, qty: 1, selectedTableIds: [],\n    communalPicks: {},\n    guestSelections: [{ set: null, drink: null }],\n    menuMode: 'wizard', menuStep: 0,\n    name: '', phone: '', email: '', note: '', ref: '',\n    _previewCode: null,\n  });\n  ['inp-name','inp-phone','inp-email','inp-note'].forEach(id => { $(id).value = ''; });\n  ['err-name','err-phone','err-email'].forEach(id => { $(id).textContent = ''; });\n  if (State.countdownTimer) clearInterval(State.countdownTimer);\n  syncFromSheet().then(() => { renderDates(); goStep(1); });\n}\n\n\u002F\u002F === ADMIN ======================================================\nlet _admTapCount = 0;\nlet _admTapTimer = null;\nfunction adminTap(btnEl) {\n  _admTapCount++;\n  if (btnEl) {\n    btnEl.classList.remove('tap-1','tap-2');\n    if (_admTapCount === 1) btnEl.classList.add('tap-1');\n    else if (_admTapCount === 2) btnEl.classList.add('tap-2');\n  }\n  clearTimeout(_admTapTimer);\n  if (_admTapCount >= 3) {\n    _admTapCount = 0;\n    if (btnEl) btnEl.classList.remove('tap-1','tap-2');\n    toggleAdmin();\n    return;\n  }\n  _admTapTimer = setTimeout(() => {\n    _admTapCount = 0;\n    if (btnEl) btnEl.classList.remove('tap-1','tap-2');\n  }, 800);\n}\n\nfunction toggleAdmin() {\n  $('admin-panel').classList.toggle('hidden');\n  if (State.adminToken && !$('admin-panel').classList.contains('hidden')) {\n    enterAdmin();\n  }\n}\n\nasync function checkAdmin() {\n  const token = $('adm-pw').value.trim();\n  if (!token) return;\n  const res = await api('verifyAdmin', { token }, { method: 'POST' });\n  if (res && res.ok) {\n    sessionStorage.setItem(CONFIG.KEY_ADMIN_TOKEN, token);\n    State.adminToken = token;\n    $('adm-err').classList.add('hidden');\n    enterAdmin();\n  } else {\n    $('adm-err').classList.remove('hidden');\n    $('adm-err').textContent = 'Token không đúng.';\n  }\n}\n\nfunction enterAdmin() {\n  $('adm-auth').classList.add('hidden');\n  $('adm-content').classList.remove('hidden');\n  refreshAdmin();\n}\n\nfunction logoutAdmin() {\n  sessionStorage.removeItem(CONFIG.KEY_ADMIN_TOKEN);\n  State.adminToken = '';\n  $('adm-auth').classList.remove('hidden');\n  $('adm-content').classList.add('hidden');\n  $('adm-pw').value = '';\n}\n\nfunction switchTab(tab) {\n  State.adminTab = tab;\n  $('tab-pending').classList.toggle('active', tab === 'pending');\n  $('tab-confirmed').classList.toggle('active', tab === 'confirmed');\n  $('tab-events').classList.toggle('active', tab === 'events');\n  const isEvents = tab === 'events';\n  $('adm-toolbar').classList.toggle('hidden', isEvents);\n  $('adm-list').classList.toggle('hidden', isEvents);\n  $('adm-events').classList.toggle('hidden', !isEvents);\n  if (isEvents) { renderAdminEvents(); return; }\n  renderAdminList();\n}\n\nasync function refreshAdmin() {\n  $('adm-list').innerHTML = '<div class=\"loading-msg\">Đang tải...<\u002Fdiv>';\n  \u002F\u002F Dùng POST để token không lộ trong URL\u002Flog\u002Freferrer.\n  const res = await api('adminList', { token: State.adminToken }, { method: 'POST' });\n  if (!res || !res.ok) {\n    if (res && res.error === 'auth') { logoutAdmin(); toast('Phiên admin đã hết hạn', 'warn'); return; }\n    $('adm-list').innerHTML = '<div class=\"loading-msg\">Lỗi tải dữ liệu.<\u002Fdiv>';\n    return;\n  }\n  State.confirmed = (res.confirmed || []).map(normalizeBooking);\n  State.pending   = (res.pending   || []).map(normalizeBooking);\n  \u002F\u002F Admin list trả về events đầy đủ (kể cả closed\u002Fhidden) — override events public đã filter.\n  if (Array.isArray(res.events) && res.events.length) {\n    State.events = res.events.map(e => ({\n      id: String(e.id),\n      label: String(e.label),\n      date: e.date ? String(e.date) : '',\n      time: e.time ? String(e.time) : '',\n      capacity: Number(e.capacity) || 0,\n      status: (e.status ? String(e.status) : 'open').toLowerCase(),\n      order: Number(e.order) || 0,\n      lockedTables: Array.isArray(e.lockedTables) ? e.lockedTables.map(String)\n        : (e.lockedTables ? String(e.lockedTables).split(',').map(s => s.trim()).filter(Boolean) : []),\n    }));\n  }\n  renderAdminStats();\n  if (State.adminTab === 'events') renderAdminEvents();\n  else renderAdminList();\n}\n\nfunction renderAdminStats() {\n  const tG = State.confirmed.reduce((s, b) => s + b.qty, 0);\n  const tR = State.confirmed.reduce((s, b) => s + b.total, 0);\n  $('adm-stats').innerHTML =\n    '<div class=\"adm-stat\"><div class=\"adm-sv\">' + State.pending.filter(b => !isExpired(b)).length + '<\u002Fdiv><div class=\"adm-sl\">Chờ duyệt<\u002Fdiv><\u002Fdiv>' +\n    '<div class=\"adm-stat\"><div class=\"adm-sv\">' + tG + '<\u002Fdiv><div class=\"adm-sl\">Khách đã xác nhận<\u002Fdiv><\u002Fdiv>' +\n    '<div class=\"adm-stat\"><div class=\"adm-sv\">' + (tR\u002F1000000).toFixed(1) + 'M<\u002Fdiv><div class=\"adm-sl\">Doanh thu (₫)<\u002Fdiv><\u002Fdiv>';\n}\n\nfunction renderAdminList() {\n  const el = $('adm-list');\n  const search = ($('adm-search').value || '').toLowerCase().trim();\n  const filterFn = b => !search ||\n    (b.name||'').toLowerCase().includes(search) ||\n    (b.phone||'').includes(search) ||\n    (b.code||'').toLowerCase().includes(search);\n\n  let list;\n  if (State.adminTab === 'pending') {\n    list = State.pending.filter(filterFn);\n  } else {\n    list = State.confirmed.filter(filterFn);\n  }\n  if (!list.length) {\n    el.innerHTML = '<div class=\"loading-msg\">Không có đơn nào.<\u002Fdiv>';\n    return;\n  }\n  el.innerHTML = [...list].reverse().map(b => adminItemHtml(b, State.adminTab === 'pending')).join('');\n}\n\nfunction adminItemHtml(b, isPending) {\n  \u002F\u002F Escape mọi field do người dùng cung cấp — tránh XSS qua name\u002Fnote (đặc biệt khi admin\n  \u002F\u002F mở admin panel cùng tab với booking flow → token sessionStorage có thể bị đánh cắp).\n  const menuTags = (b.guests||[]).map((mid, i) => {\n    return '<span class=\"set-tag\">K' + (i+1) + ': ' + escapeHtml(decodeGuestPick(mid, b.eventId)) + '<\u002Fspan>';\n  }).join('');\n  const expired = isPending && isExpired(b);\n  const safeCode = escapeHtml(b.code || '');\n  const actions = isPending\n    ? (expired\n      ? '<span class=\"badge b-exp\">Đã hết hạn<\u002Fspan>'\n      : '<button class=\"btn-confirm\" data-action=\"admin-confirm\" data-code=\"' + safeCode + '\">Xác nhận<\u002Fbutton>' +\n        '<button class=\"btn-cancel-mini\" data-action=\"admin-reject\" data-code=\"' + safeCode + '\">Từ chối<\u002Fbutton>')\n    : '<span class=\"badge b-conf\">Đã xác nhận<\u002Fspan>';\n  return '<div class=\"adm-item\">' +\n    '<div style=\"display:flex;justify-content:space-between;align-items:baseline;\">' +\n      '<span class=\"adm-name\">' + escapeHtml(b.name || '') + '<\u002Fspan>' +\n      '<span style=\"font-size:13px;color:#7a0000;font-weight:500;\">' + fmt(b.total) + '<\u002Fspan>' +\n    '<\u002Fdiv>' +\n    '<div class=\"adm-meta\">' + escapeHtml(b.eventLabel || '') + ' · ' + escapeHtml(b.comboLabel || '') + ' · ' + escapeHtml(String(b.qty || '')) + ' khách<\u002Fdiv>' +\n    '<div style=\"margin-top:4px;\">' + menuTags + '<\u002Fdiv>' +\n    '<div class=\"adm-meta\" style=\"margin-top:4px;\">SĐT: ' + escapeHtml(b.phone || '') + ' · Mã: ' + safeCode + ' · CK: ' + escapeHtml(b.ref || '') + (b.note ? ' · ' + escapeHtml(b.note) : '') + '<\u002Fdiv>' +\n    '<div style=\"margin-top:6px;\">' + actions + '<\u002Fdiv>' +\n  '<\u002Fdiv>';\n}\n\nasync function adminConfirm(code, btnEl) {\n  btnEl.disabled = true; btnEl.textContent = 'Đang xác nhận...';\n  const res = await api('confirm', { token: State.adminToken, code }, { method: 'POST' });\n  if (res && res.ok) {\n    toast('Đã xác nhận ' + code, 'ok');\n    await refreshAdmin();\n  } else {\n    btnEl.disabled = false; btnEl.textContent = 'Xác nhận';\n    toast('Xác nhận thất bại: ' + (res && res.error || 'lỗi'), 'err');\n  }\n}\n\nasync function adminReject(code, btnEl) {\n  const ok = await modalConfirm({\n    title: 'Từ chối booking ' + code + '?',\n    body: 'Hành động này không hoàn tác được. Booking sẽ bị xoá khỏi danh sách chờ.',\n    confirmText: 'Từ chối',\n    cancelText: 'Quay lại',\n    danger: true,\n  });\n  if (!ok) return;\n  btnEl.disabled = true; btnEl.textContent = 'Đang từ chối...';\n  const res = await api('reject', { token: State.adminToken, code }, { method: 'POST' });\n  if (res && res.ok) {\n    toast('Đã từ chối ' + code, 'ok');\n    await refreshAdmin();\n  } else {\n    btnEl.disabled = false;\n    toast('Lỗi: ' + (res && res.error || ''), 'err');\n  }\n}\n\nfunction exportCSV() {\n  const list = State.adminTab === 'pending' ? State.pending : State.confirmed;\n  if (!list.length) { toast('Không có dữ liệu để xuất', 'warn'); return; }\n  const headers = ['code','eventLabel','comboLabel','qty','total','name','phone','email','note','ref','status','createdAt'];\n  const rows = [headers.join(',')].concat(list.map(b =>\n    headers.map(h => '\"' + String(b[h] || '').replace(\u002F\"\u002Fg,'\"\"') + '\"').join(',')\n  ));\n  const blob = new Blob(['﻿' + rows.join('\\n')], { type: 'text\u002Fcsv;charset=utf-8' });\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement('a');\n  a.href = url; a.download = 'dapdieu_' + State.adminTab + '_' + new Date().toISOString().slice(0,10) + '.csv';\n  a.click();\n  URL.revokeObjectURL(url);\n}\n\n\u002F\u002F === ADMIN: EVENTS MANAGEMENT ==================================\nconst _evState = { editing: null, formOpen: false, draft: null };\n\nfunction escapeHtml(s) {\n  return String(s == null ? '' : s)\n    .replace(\u002F&\u002Fg,'&amp;').replace(\u002F<\u002Fg,'&lt;').replace(\u002F>\u002Fg,'&gt;')\n    .replace(\u002F\"\u002Fg,'&quot;').replace(\u002F'\u002Fg,'&#39;');\n}\n\nfunction eventBookingsCount(eventId) {\n  const c = State.confirmed.filter(b => b.eventId === eventId).length;\n  const p = State.pending.filter(b => b.eventId === eventId && !isExpired(b)).length;\n  return { confirmed: c, pending: p, total: c + p };\n}\n\n\u002F\u002F Quản lý khoá bàn chung theo sự kiện (admin). Bàn khoá => khách thấy FULL.\nfunction adminLockSectionHtml(ev) {\n  const occ = communalOccupancy(ev.id);\n  const locked = Array.isArray(ev.lockedTables) ? ev.lockedTables : [];\n  const rows = ALL_TABLES.filter(t => t.communal).map(t => {\n    const used = occ[t.id] || 0;\n    const isLk = locked.indexOf(t.id) !== -1;\n    const info = isLk\n      ? '<b style=\\'color:var(--accent);\\'>Đã khoá · full<\u002Fb>'\n      : (used + '\u002F' + t.cap + ' ghế đã đặt');\n    const btn = '<button class=\\'btn-g\\' style=\\'margin-top:0;font-size:11px;padding:4px 11px;\\' data-action=\\'ev-lock-toggle\\' data-id=\\'' + escapeHtml(ev.id) + '\\' data-table=\\'' + t.id + '\\'>' + (isLk ? 'Mở khoá' : 'Khoá') + '<\u002Fbutton>';\n    return '<div style=\\'display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;\\'>' +\n      '<span style=\\'font-size:12px;color:var(--text2);\\'>Bàn ' + t.name + ' · ' + info + '<\u002Fspan>' + btn + '<\u002Fdiv>';\n  }).join('');\n  return '<details style=\\'margin-top:8px;\\'><summary style=\\'font-size:12px;cursor:pointer;color:var(--text2);\\'>Khoá bàn riêng (' + locked.length + ' bàn)<\u002Fsummary>' +\n    '<div style=\\'margin-top:4px;padding-left:2px;\\'>' + rows + '<\u002Fdiv><\u002Fdetails>';\n}\n\nfunction renderAdminEvents() {\n  const el = $('adm-events');\n  const list = [...State.events].sort((a, b) => (a.order || 0) - (b.order || 0));\n  const formHtml = _evState.formOpen ? eventFormHtml(_evState.draft || {}) : '';\n  const addBtn = _evState.formOpen\n    ? ''\n    : '<button class=\"btn-p\" style=\"margin-top:.5rem;\" data-action=\"ev-new\">+ Thêm sự kiện<\u002Fbutton>';\n  const rows = list.length\n    ? list.map(eventRowHtml).join('')\n    : '<div class=\"loading-msg\">Chưa có sự kiện nào.<\u002Fdiv>';\n  el.innerHTML = formHtml + addBtn + '<div style=\"margin-top:.75rem;\">' + rows + '<\u002Fdiv>';\n}\n\nfunction eventRowHtml(ev) {\n  const status = (ev.status || 'open').toLowerCase();\n  const cnt = eventBookingsCount(ev.id);\n  const meta = [\n    ev.date || '—',\n    ev.time || '—',\n    'Capacity: ' + (ev.capacity || 0),\n    'Booking: ' + cnt.total + (cnt.pending ? ' (' + cnt.pending + ' chờ)' : ''),\n  ].join(' · ');\n  const badge = status === 'closed'\n    ? '<span class=\"badge b-exp\">Đã đóng<\u002Fspan>'\n    : '<span class=\"badge b-conf\">Đang mở<\u002Fspan>';\n  const toggleLabel = status === 'closed' ? 'Mở lại' : 'Đóng';\n  return '<div class=\"adm-item\">' +\n    '<div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:8px;\">' +\n      '<span class=\"adm-name\">' + escapeHtml(ev.label) + '<\u002Fspan>' +\n      badge +\n    '<\u002Fdiv>' +\n    '<div class=\"adm-meta\">' + escapeHtml(meta) + '<\u002Fdiv>' +\n    '<div class=\"adm-meta\" style=\"margin-top:2px;\">ID: ' + escapeHtml(ev.id) + '<\u002Fdiv>' +\n    adminLockSectionHtml(ev) +\n    '<div style=\"margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;\">' +\n      '<button class=\"btn-g\" style=\"margin-top:0;font-size:12px;\" data-action=\"ev-toggle\" data-id=\"' + escapeHtml(ev.id) + '\">' + toggleLabel + '<\u002Fbutton>' +\n      '<button class=\"btn-g\" style=\"margin-top:0;font-size:12px;\" data-action=\"ev-edit\" data-id=\"' + escapeHtml(ev.id) + '\">Sửa<\u002Fbutton>' +\n      '<button class=\"btn-danger\" style=\"margin-top:0;font-size:12px;\" data-action=\"ev-delete\" data-id=\"' + escapeHtml(ev.id) + '\">Xoá<\u002Fbutton>' +\n    '<\u002Fdiv>' +\n  '<\u002Fdiv>';\n}\n\nfunction eventFormHtml(d) {\n  const isEdit = !!_evState.editing;\n  const id = d.id || '';\n  const label = d.label || '';\n  const date = d.date || '';\n  const time = d.time || '11:00 - 13:30';\n  const capacity = d.capacity != null ? d.capacity : '';\n  const status = (d.status || 'open').toLowerCase();\n  return '<div class=\"card\" style=\"margin-bottom:.5rem;\">' +\n    '<div class=\"lbl\">' + (isEdit ? 'Sửa sự kiện' : 'Thêm sự kiện') + '<\u002Fdiv>' +\n    '<div class=\"lbl\" style=\"font-size:11px;\">ID<\u002Fdiv>' +\n    '<input class=\"inp\" type=\"text\" id=\"ev-id\" value=\"' + escapeHtml(id) + '\" placeholder=\"(tự sinh từ ngày)\" readonly style=\"opacity:.7;\">' +\n    '<div class=\"lbl\" style=\"font-size:11px;margin-top:6px;\">Nhãn hiển thị<\u002Fdiv>' +\n    '<input class=\"inp\" type=\"text\" id=\"ev-label\" value=\"' + escapeHtml(label) + '\" placeholder=\"Thứ Bảy, 9\u002F6\u002F2026\">' +\n    '<div class=\"lbl\" style=\"font-size:11px;margin-top:6px;\">Ngày<\u002Fdiv>' +\n    '<input class=\"inp\" type=\"date\" id=\"ev-date\" value=\"' + escapeHtml(date) + '\">' +\n    '<div class=\"lbl\" style=\"font-size:11px;margin-top:6px;\">Thời gian<\u002Fdiv>' +\n    '<input class=\"inp\" type=\"text\" id=\"ev-time\" value=\"' + escapeHtml(time) + '\">' +\n    '<div class=\"lbl\" style=\"font-size:11px;margin-top:6px;\">Capacity (số ghế tối đa)<\u002Fdiv>' +\n    '<input class=\"inp\" type=\"number\" id=\"ev-capacity\" min=\"0\" value=\"' + escapeHtml(String(capacity)) + '\">' +\n    '<div class=\"lbl\" style=\"font-size:11px;margin-top:6px;\">Trạng thái<\u002Fdiv>' +\n    '<select class=\"inp\" id=\"ev-status\">' +\n      '<option value=\"open\"' + (status === 'open' ? ' selected' : '') + '>Mở<\u002Foption>' +\n      '<option value=\"closed\"' + (status === 'closed' ? ' selected' : '') + '>Đóng<\u002Foption>' +\n    '<\u002Fselect>' +\n    '<div style=\"display:flex;gap:6px;margin-top:.6rem;\">' +\n      '<button class=\"btn-p\" style=\"flex:1;\" data-action=\"ev-save\">Lưu<\u002Fbutton>' +\n      '<button class=\"btn-g\" style=\"flex:1;margin-top:0;\" data-action=\"ev-cancel\">Huỷ<\u002Fbutton>' +\n    '<\u002Fdiv>' +\n  '<\u002Fdiv>';\n}\n\nfunction eventDateAutoSync() {\n  const dEl = $('ev-date'); const iEl = $('ev-id');\n  if (!dEl || !iEl) return;\n  dEl.addEventListener('change', () => {\n    if (dEl.value) iEl.value = 'e' + dEl.value;\n  });\n}\n\nfunction evNew() {\n  _evState.editing = null;\n  _evState.formOpen = true;\n  _evState.draft = { status: 'open', time: '11:00 - 13:30' };\n  renderAdminEvents();\n  setTimeout(eventDateAutoSync, 0);\n}\n\nfunction evEdit(id) {\n  const ev = State.events.find(e => e.id === id);\n  if (!ev) return;\n  _evState.editing = id;\n  _evState.formOpen = true;\n  _evState.draft = { ...ev };\n  renderAdminEvents();\n  setTimeout(eventDateAutoSync, 0);\n}\n\nfunction evCancel() {\n  _evState.editing = null;\n  _evState.formOpen = false;\n  _evState.draft = null;\n  renderAdminEvents();\n}\n\nfunction evReadForm() {\n  const date = $('ev-date').value.trim();\n  const id = ($('ev-id').value.trim()) || (date ? 'e' + date : '');\n  return {\n    id,\n    label: $('ev-label').value.trim(),\n    date,\n    time: $('ev-time').value.trim(),\n    capacity: Number($('ev-capacity').value) || 0,\n    status: $('ev-status').value,\n  };\n}\n\nfunction evErrorToast(prefix, res) {\n  const err = (res && res.error) ? String(res.error) : 'không phản hồi';\n  console.warn('[event op]', prefix, 'response:', res);\n  let msg = prefix + ': ' + err;\n  if (\u002Funknown action\u002Fi.test(err)) {\n    msg = 'Backend chưa hỗ trợ — cần redeploy Apps Script bản mới (Deploy → Manage deployments → Edit → Version: New version).';\n  } else if (err === 'auth') {\n    msg = 'Phiên admin hết hạn — vui lòng đăng nhập lại.';\n  } else if (err === 'duplicate id') {\n    msg = 'Trùng ID — sự kiện này đã tồn tại trong sheet.';\n  } else if (err === 'not found') {\n    msg = 'Không tìm thấy sự kiện trong sheet (có thể đây là sự kiện mặc định, chưa được thêm vào sheet).';\n  } else if (err === 'no-sheet-url') {\n    msg = 'Chưa cấu hình SHEET_URL — không thể gọi backend.';\n  }\n  toast(msg, 'err', 7000);\n}\n\nasync function evSave(btnEl) {\n  const f = evReadForm();\n  const isEdit = !!_evState.editing;\n  if (!f.label) { toast('Thiếu nhãn hiển thị', 'warn'); return; }\n  if (!isEdit && !f.date) { toast('Chọn ngày sự kiện', 'warn'); return; }\n  if (!f.id)    { toast('ID không hợp lệ', 'warn'); return; }\n  btnEl.disabled = true; btnEl.textContent = 'Đang lưu...';\n  const action = isEdit ? 'updateEvent' : 'addEvent';\n  const payload = isEdit\n    ? { token: State.adminToken, ...f }\n    : { token: State.adminToken, ...f, order: (State.events.length + 1) };\n  const res = await api(action, payload, { method: 'POST' });\n  if (res && res.ok) {\n    toast(isEdit ? 'Đã cập nhật sự kiện' : 'Đã thêm sự kiện', 'ok');\n    _evState.editing = null; _evState.formOpen = false; _evState.draft = null;\n    await syncFromSheet();\n    await refreshAdmin();\n    renderAdminEvents();\n  } else {\n    btnEl.disabled = false; btnEl.textContent = 'Lưu';\n    evErrorToast('Không lưu được', res);\n  }\n}\n\nasync function evToggle(id) {\n  const ev = State.events.find(e => e.id === id);\n  if (!ev) return;\n  const next = (ev.status || 'open') === 'closed' ? 'open' : 'closed';\n  const res = await api('updateEvent', {\n    token: State.adminToken, id, status: next,\n  }, { method: 'POST' });\n  if (res && res.ok) {\n    toast(next === 'closed' ? 'Đã đóng sự kiện' : 'Đã mở lại sự kiện', 'ok');\n    await syncFromSheet();\n    await refreshAdmin();\n    renderAdminEvents();\n  } else {\n    evErrorToast('Không cập nhật được', res);\n  }\n}\n\nasync function evLockToggle(eventId, tableId) {\n  const ev = State.events.find(e => e.id === eventId);\n  if (!ev) return;\n  const cur = Array.isArray(ev.lockedTables) ? ev.lockedTables.slice() : [];\n  const i = cur.indexOf(tableId);\n  const willLock = i === -1;\n  if (willLock) cur.push(tableId); else cur.splice(i, 1);\n  const res = await api('updateEvent', { token: State.adminToken, id: eventId, lockedTables: cur }, { method: 'POST' });\n  if (res && res.ok) {\n    ev.lockedTables = cur;\n    toast(willLock ? ('Đã khoá bàn ' + tableId + ' (hiển thị full)') : ('Đã mở khoá bàn ' + tableId), 'ok');\n    await syncFromSheet();\n    await refreshAdmin();\n    renderAdminEvents();\n  } else if (res && res.error === 'no-sheet-url') {\n    ev.lockedTables = cur;\n    toast('Chưa cấu hình Sheet — chỉ khoá tạm trên máy này.', 'warn', 5000);\n    renderAdminEvents();\n  } else {\n    evErrorToast('Không cập nhật được khoá bàn', res);\n  }\n}\n\nasync function evDelete(id) {\n  const ev = State.events.find(e => e.id === id);\n  if (!ev) return;\n  const ok = await modalConfirm({\n    title: 'Xoá sự kiện?',\n    body: '\"' + ev.label + (ev.date ? ' · ' + ev.date : '') + '\"\\nHành động không hoàn tác được.',\n    confirmText: 'Xoá',\n    cancelText: 'Huỷ',\n    danger: true,\n  });\n  if (!ok) return;\n  const res = await api('deleteEvent', { token: State.adminToken, id }, { method: 'POST' });\n  if (res && res.ok) {\n    toast('Đã xoá sự kiện', 'ok');\n    await syncFromSheet();\n    await refreshAdmin();\n    renderAdminEvents();\n  } else if (res && res.error === 'has_bookings') {\n    toast('Không thể xoá — sự kiện này còn booking đang hoạt động.', 'err', 6000);\n  } else {\n    evErrorToast('Không xoá được', res);\n  }\n}\n\n\u002F\u002F === EVENT DELEGATION ===========================================\ndocument.addEventListener('click', async (e) => {\n  const t = e.target.closest('[data-action]');\n  if (t) {\n    const action = t.dataset.action;\n    if (action === 'toggle-lang') return applyLang(LANG === 'en' ? 'vi' : 'en');\n    if (action === 'admin-tap') return adminTap(t);\n    if (action === 'check-admin') return checkAdmin();\n    if (action === 'logout-admin') return logoutAdmin();\n    if (action === 'refresh-admin') return refreshAdmin();\n    if (action === 'export-csv') return exportCSV();\n    if (action === 'qty-minus') return changeQty(-1);\n    if (action === 'qty-plus')  return changeQty(1);\n    if (action === 'go-step')   return goStep(Number(t.dataset.step));\n    if (action === 'check-status') return checkStatus();\n    if (action === 'submit-booking') return submitBooking(t);\n    if (action === 'reset') return resetBooking();\n    if (action === 'print') return window.print();\n    if (action === 'cancel-booking') return cancelBooking(t.dataset.code);\n    if (action === 'admin-confirm') return adminConfirm(t.dataset.code, t);\n    if (action === 'admin-reject')  return adminReject(t.dataset.code, t);\n    if (action === 'pick-set')   return pickSet(Number(t.dataset.guest), t.dataset.set);\n    \u002F\u002F pick-drink trên BUTTON (legacy\u002Ffallback). Dropdown <select> được xử lý ở 'change' delegation bên dưới.\n    if (action === 'pick-drink' && t.tagName !== 'SELECT') return pickDrink(Number(t.dataset.guest), t.dataset.drink);\n    if (action === 'comm-plus')  return addCommunalSeat(t.dataset.table);\n    if (action === 'comm-minus') return removeCommunalSeat(t.dataset.table);\n    if (action === 'menu-prev')  return menuPrev();\n    if (action === 'menu-next')  return menuNext();\n    if (action === 'menu-edit')  return menuEdit();\n    if (action === 'ev-new')    return evNew();\n    if (action === 'ev-edit')   return evEdit(t.dataset.id);\n    if (action === 'ev-cancel') return evCancel();\n    if (action === 'ev-save')   return evSave(t);\n    if (action === 'ev-toggle') return evToggle(t.dataset.id);\n    if (action === 'ev-delete') return evDelete(t.dataset.id);\n    if (action === 'ev-lock-toggle') return evLockToggle(t.dataset.id, t.dataset.table);\n  }\n  \u002F\u002F Date click\n  const dt = e.target.closest('.date-btn');\n  if (dt && !dt.classList.contains('full')) {\n    return selectDate(dt.dataset.event);\n  }\n  \u002F\u002F Tab click\n  const tab = e.target.closest('.adm-tab');\n  if (tab) return switchTab(tab.dataset.tab);\n  \u002F\u002F Click vào ghế đơn trong bàn chung — gộp vào logic click table body (tableClick).\n  \u002F\u002F Vì .seat nằm trong .tbl-group → click bất cứ đâu trong bàn chung đều = +1 ghế.\n  \u002F\u002F Để bỏ ghế: dùng stepper − ở sel-bar (rõ ràng + dễ thao tác trên mobile).\n  const tbl = e.target.closest('.tbl-group');\n  if (tbl && State.step === 3) return tableClick(tbl.dataset.table);\n  \u002F\u002F Copy\n  const copy = e.target.closest('[data-copy]');\n  if (copy) {\n    const text = $(copy.dataset.copy).textContent;\n    navigator.clipboard.writeText(text).then(() => {\n      copy.classList.add('copied'); copy.textContent = tr('copied');\n      setTimeout(() => { copy.classList.remove('copied'); copy.textContent = tr('copy'); }, 1500);\n    });\n  }\n});\n\n\u002F\u002F Drink select (<select data-action=\"pick-drink\">) — change delegation\ndocument.addEventListener('change', (e) => {\n  const t = e.target.closest('[data-action]');\n  if (!t || t.tagName !== 'SELECT') return;\n  if (t.dataset.action === 'pick-drink') {\n    pickDrink(Number(t.dataset.guest), t.value);\n  }\n});\n\n\u002F\u002F Keyboard support: Enter for inputs\ndocument.addEventListener('keydown', (e) => {\n  if (e.key === 'Enter') {\n    if (e.target.id === 'adm-pw') checkAdmin();\n    if (e.target.id === 'check-code') checkStatus();\n    if (e.target.id === 'adm-search') renderAdminList();\n  }\n  \u002F\u002F SVG bàn (a11y): Enter \u002F Space khi focus vào .tbl-group → click chọn bàn.\n  if ((e.key === 'Enter' || e.key === ' ') && State.step === 3) {\n    const g = e.target.closest && e.target.closest('.tbl-group');\n    if (g && g.dataset.table) {\n      e.preventDefault();\n      tableClick(g.dataset.table);\n    }\n  }\n});\n\n\u002F\u002F Gắn tabindex=\"0\" cho mọi .tbl-group để focus được bằng Tab key.\n\u002F\u002F Làm 1 lần khi DOM ready (SVG đã có sẵn trong HTML).\ndocument.querySelectorAll('.tbl-group').forEach(g => {\n  if (!g.hasAttribute('tabindex')) g.setAttribute('tabindex', '0');\n});\n['inp-name','inp-phone','inp-email','inp-note'].forEach(id => {\n  document.addEventListener('input', (e) => { if (e.target.id === id) validateForm(); });\n});\ndocument.addEventListener('input', (e) => { if (e.target.id === 'adm-search') renderAdminList(); });\n\n\u002F\u002F Auto-refresh khi user quay lại tab\ndocument.addEventListener('visibilitychange', () => {\n  if (!document.hidden && State.step <= 3) {\n    syncFromSheet().then(() => {\n      renderDates();\n      if (State.step === 3) updateMapStates();\n      else if (State.step === 2) updateQtyHint();\n    });\n  }\n});\n\n\u002F\u002F === INIT =======================================================\nasync function init() {\n  \u002F\u002F Áp ngôn ngữ đã lưu (VI mặc định) trước khi render text tĩnh.\n  applyStaticI18n();\n  document.documentElement.lang = LANG;\n  const _langBtn = document.getElementById('lang-toggle');\n  if (_langBtn) _langBtn.textContent = (LANG === 'en') ? 'Tiếng Việt' : 'English';\n  $('date-grid').innerHTML = '<div class=\"loading-msg\">' + tr('loading') + '<\u002Fdiv>';\n  \u002F\u002F Render sơ đồ SVG động từ TABLE_LAYOUT (1 lần khi load page).\n  buildMapSvg();\n  setupMapScrollHints();\n  \u002F\u002F Giữ trạng thái \"Đang tải dữ liệu...\" cho tới khi syncFromSheet trả dữ liệu thật\n  \u002F\u002F (tránh nhấp nháy ngày mẫu EVENTS_FALLBACK). Offline sẽ render fallback sau khi sync.\n  if (!hasSheetUrl()) {\n    toast(tr('toast_offline'), 'warn', 5000);\n  }\n  try {\n    await syncFromSheet();\n  } catch (e) {\n    toast(tr('toast_conn_err'), 'warn');\n  }\n  renderDates();\n\n  \u002F\u002F Deep link: ?code=DD-XXXXX → auto check status\n  const urlCode = new URLSearchParams(location.search).get('code');\n  if (urlCode) {\n    $('check-code').value = urlCode.toUpperCase();\n    setTimeout(() => checkStatus(urlCode), 200);\n  }\n}\n\ninit();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
