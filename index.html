  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

không quá rộng để không phá tỷ lệ form). *\u002F\n.page-wrap { max-width: 600px; margin: 0 auto; padding: 2rem 1.25rem 3rem; }\n@media (min-width: 768px)  { .page-wrap { max-width: 660px; padding: 2.25rem 1.5rem 3rem; } }\n@media (min-width: 1024px) { .page-wrap { max-width: 720px; padding: 2.5rem 1.5rem 3rem; } }\n@media (min-width: 1440px) { .page-wrap { max-width: 760px; } }\n\u002F* ====== MINI POSTER BANNER (header) ====== *\u002F\n.poster-banner {\n  position: relative; overflow: hidden; color: var(--cream);\n  background: var(--red);\n  background-image: radial-gradient(130% 90% at 82% -15%, rgba(255,255,255,0.1), transparent 55%), linear-gradient(180deg, #840000 0%, var(--red) 60%, #6e0000 100%);\n  border-radius: 0 0 22px 22px;\n  padding: 16px 20px 0;\n  margin: -2rem -1.25rem 1.5rem;\n}\n@media (min-width: 768px)  { .poster-banner { margin: -2.25rem -1.5rem 1.6rem; } }\n@media (min-width: 1024px) { .poster-banner { margin: -2.5rem -1.5rem 1.85rem; } }\n.pb-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }\n.pb-logo { height: 30px; width: auto; display: block; }\n@media (min-width: 768px) { .pb-logo { height: 34px; } }\n.pb-title { margin-top: 14px; position: relative; z-index: 1; }\n.pb-chunky { display: block; font-family: var(--font-display); font-weight: 400; text-transform: uppercase; color: var(--cream); font-size: 33px; line-height: 0.96; letter-spacing: 0.004em; }\n@media (max-width: 380px) { .pb-chunky { font-size: 28px; } }\n.pb-scriptline { display: flex; align-items: flex-end; gap: 9px; margin-top: 4px; padding-bottom: 4px; }\n.pb-script { font-family: var(--font-script); font-weight: 700; color: var(--mint); font-size: 50px; line-height: 0.9; display: inline-block; text-shadow: 0 2px 0 rgba(0,0,0,0.12); }\n.pb-vol { font-family: var(--font-body); font-weight: 600; font-size: 11px; letter-spacing: 0.1em; color: var(--cream); opacity: 0.78; text-transform: uppercase; padding-bottom: 9px; }\n.pb-meta { display: flex; align-items: center; gap: 26px; flex-wrap: wrap; margin: 20px 0 22px; position: relative; z-index: 1; }\n.pb-drag-pill { font-family: var(--font-display); font-size: 13.5px; letter-spacing: 0.05em; color: var(--mint); text-transform: uppercase; padding: 9px 17px; border-radius: 999px; background: linear-gradient(177deg, var(--red-bright), var(--red-deep)); box-shadow: inset 0 1.5px 1px rgba(255,255,255,0.4), inset 0 -3px 6px rgba(0,0,0,0.42), 0 3px 8px rgba(0,0,0,0.2); white-space: nowrap; }\n.pb-by { position: absolute; right: 30px; bottom: 52px; z-index: 2; text-align: right; font-family: var(--font-script); font-weight: 600; font-size: 17px; line-height: 1.24; color: var(--cream); opacity: 0.95; white-space: nowrap; }\n@media (max-width: 600px) { .pb-by { font-size: 14px; bottom: 48px; right: 24px; } }\n@media (max-width: 430px) { .pb-by { font-size: 13px; bottom: 54px; right: 20px; opacity: 0.9; } }\n.pb-sub { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--cream); color: var(--red); margin: 0 -20px; padding: 10px 20px; }\n.pb-sub-l { font-family: var(--font-body); font-weight: 700; font-size: 14px; letter-spacing: 0.01em; }\n.pb-sub-r { font-family: var(--font-body); font-weight: 600; font-size: 12.5px; opacity: 0.82; }\n.adm-btn { font-size: 12px; color: var(--text2); background: none; border: 0.5px solid var(--border); border-radius: var(--radius); padding: 5px 11px; cursor: pointer; font-family: var(--font-body); flex-shrink: 0; margin-top: 4px; }\n.adm-btn:hover { background: var(--surface2); }\n.header-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }\n.lang-btn { font-size: 11px; font-weight: 600; color: var(--cream); background: rgba(255,255,255,0.12); border: 1px solid rgba(255,235,184,0.5); border-radius: 999px; padding: 6px 13px; cursor: pointer; font-family: var(--font-body); white-space: nowrap; transition: background 0.15s; }\n.lang-btn:hover { background: rgba(255 ize: 12px; color: var(--text3); text-align: center; padding: 4px 0 0; }\n\n.map-wrap { background: var(--surface2); border-radius: var(--radius); padding: 12px; overflow-x: auto; position: relative; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }\n\u002F* Gradient hai cạnh báo còn nội dung scroll. Tự ẩn khi user đã scroll tới rìa. *\u002F\n.map-wrap::before, .map-wrap::after {\n  content: '';\n  position: absolute;\n  top: 0;\n  bottom: 0;\n  width: 36px;\n  pointer-events: none;\n  z-index: 2;\n  transition: opacity 0.25s;\n}\n.map-wrap::before {\n  left: 0;\n  background: linear-gradient(to right, var(--surface2) 0%, rgba(245, 240, 235, 0) 100%);\n  opacity: 0;\n}\n.map-wrap::after {\n  right: 0;\n  background: linear-gradient(to left, var(--surface2) 0%, rgba(245, 240, 235, 0) 100%);\n  opacity: 1;\n}\n.map-wrap.scrolled-start::before { opacity: 1; }\n.map-wrap.scrolled-end::after    { opacity: 0; }\n\u002F* Khi không scroll được (tablet+) → ẩn cả 2 gradient *\u002F\n.map-wrap.no-scroll::before, .map-wrap.no-scroll::after { opacity: 0; }\n\n\u002F* Mũi tên animation báo \"vuốt sang phải\" — chỉ hiển thị khi còn scroll *\u002F\n.map-scroll-hint {\n  position: absolute;\n  right: 8px;\n  top: 50%;\n  transform: translateY(-50%);\n  width: 30px;\n  height: 30px;\n  border-radius: 50%;\n  background: var(--accent);\n  color: #fff;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  font-size: 18px;\n  font-weight: 600;\n  z-index: 3;\n  pointer-events: none;\n  box-shadow: 0 2px 8px rgba(123, 101, 80, 0.35);\n  animation: nudgeArrow 1.4s infinite ease-in-out;\n  transition: opacity 0.3s;\n}\n@keyframes nudgeArrow {\n  0%, 100% { transform: translateY(-50%) translateX(0); }\n  50%       { transform: translateY(-50%) translateX(-5px); }\n}\n.map-wrap.scrolled-end .map-scroll-hint,\n.map-wrap.no-scroll  .map-scroll-hint { opacity: 0; }\n\n\u002F* Hint text dưới sơ đồ — chỉ hiển thị trên mobile khi còn cần scroll *\u002F\n.map-hint-text the phone number used to book.',\n    verify_ph: 'Last 4 digits',\n    verify_ok: 'Verify',\n    toast_cancelled: 'Booking {code} cancelled',\n    toast_cancel_fail: 'Could not cancel: {err}',\n    err_unknown: 'unknown error',\n    ok_default: 'OK',\n    cancel_default: 'Cancel',\n    confirm_default: 'Confirm',\n    loading: 'Loading data...',\n    toast_offline: 'SHEET_URL not configured — running in offline mode',\n    toast_conn_err: 'Server connection error, data may be out of date.',\n    copied: 'Copied',\n    copy: 'Copy',\n    days: ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],\n    months: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],\n  },\n};\n\u002F\u002F Đặt tên `tr` (không phải `t`) vì code cũ dùng biến cục bộ `t` cho object bàn.\nfunction tr(key, p) {\n  let s = (I18N[LANG] && I18N[LANG][key] != null) ? I18N[LANG][key] : null;\n  if (s == null) s = (I18N.vi[key] != null ? I18N.vi[key] : key);\n  if (p && typeof s === 'string') {\n    Object.keys(p).forEach(k => { s = s.split('{' + k + '}').join(p[k]); });\n  }\n  return s;\n}\n\u002F\u002F Dịch tên khu (\"Khu A\" → \"Area A\") chỉ cho hiển thị khách khi EN.\nfunction roomName(room) {\n  if (LANG === 'en' && typeof room === 'string') return room.replace(\u002F^Khu\\s+\u002Fi, 'Area ');\n  return room;\n}\nfunction applyStaticI18n() {\n  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tr(el.getAttribute('data-i18n')); });\n  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = tr(el.getAttribute('data-i18n-html')); });\n  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.setAttribute('placeholder', tr(el.getAttribute('data-i18n-ph'))); });\n}\nfunction applyLang(lang) {\n  LANG = (lang === 'en') ? 'en' : 'vi';\n  try { localStorage.setItem('dd_lang', LANG); } catch (e) {}\n  document.documentElement.lang = LANG;\n  const btn = document.getElementById('lang-toggle');\n  if (btn) btn.textContent = (LANG === 'en') ? 'Tiếng Việt' : 'English';\n  applyStaticI18n();\n  rerenderForLang();\n}\n\u002F\u002F Render lại phần customer đang hiển thị để chuỗi động đổi ngôn ngữ ngay.\nfunction rerenderForLang() {\n  try { renderDates(); } catch (e) {}\n  if (State.step === 2) { try { updateQtyHint(); } catch (e) {} }\n  if (State.step === 3) { try { updateMapStates(); } catch (e) {} }\n  if (State.step === 4) {\n    try {\n      renderMenuBanner();\n      if (State.menuMode === 'wizard') {\n        $('menu-card-lbl').textContent = tr('menu_card_wizard');\n        renderGuestRows();\n        renderMenuWizardNav();\n      } else {\n        $('menu-card-lbl').textContent = tr('menu_chosen');\n        renderMenuReview();\n        validateForm();\n      }\n    } catch (e) {}\n  }\n  if (State.step === 4 || State.step === 'success') {\n    if (State._successCreatedAt) { try { startCountdown(State._successCreatedAt); } catch (e) {} }\n  }\n  \u002F\u002F Re-render status result nếu đang hiển thị\n  const sr = document.getElementById('status-result');\n  if (sr && !sr.classList.contains('hidden')) {\n    const code = (document.getElementById('check-code').value || '').trim();\n    if (code) { try { checkStatus(code); } catch (e) {} }\n  }\n}\n\u002F\u002F ================================================================\n\u002F\u002F Cải tiến v4.2 (so với v4):\n\u002F\u002F  - Pull menu từ Sheet `Menus` qua State.menus (admin sửa menu không cần redeploy).\n\u002F\u002F  - Build menuSnapshot khi submit để email confirmation render đúng dù admin sửa menu sau.\n\u002F\u002F  - Set ID chuẩn hoá 1 ký tự uppercase ('A','B') khớp backend.\n\u002F\u002F  - Modal đẹp thay native confirm\u002Fprompt cho UX mobile tốt hơn.\n\u002F\u002F  - Cleanup localStorage pending hết hạn.\n\u002F\u002F  - SVG bàn truy cập được bằng bàn phím (tabindex + Enter\u002FSpace).\n\u002F\u002F  - field-err có aria-live cho screen reader.\n\u002F\u002F  - adminList qua POST (token không lộ trong URL\u002Flog).\n\u002F\u002F  - Retry 1 lần khi gặp 'code collision'.\n\u002F\u002F  - Giữ bàn đã chọn khi quay lại từ step 4 → step 3.\n\u002F\u002F  - checkStatus hiển thị đầy đủ (ngày + bàn + qty + tổng tiền + ghi chú).\n\u002F\u002F  - Escape XSS trong admin panel rendering.\n\u002F\u002F ================================================================\n\n\u002F\u002F === CẤU HÌNH ===================================================\nconst CONFIG = {\n  PRICE: 350000,\n  PENDING_TTL_MIN: 480,           \u002F\u002F pending hết hạn sau 8 giờ (480 phút) — phải khớp backend\n  KEY_PENDING_LOCAL: 'dapdieu_pending_v4',\n  KEY_ADMIN_TOKEN: 'dapdieu_admin_token_v4', \u002F\u002F sessionStorage\n  \u002F\u002F Dán URL Apps Script v4 vào đây sau khi deploy\n  SHEET_URL: 'https:\u002F\u002Fscript.google.com\u002Fmacros\u002Fs\u002FAKfycbxFRpS-6EYa1KXFCIzGk5kS311b3jS5J7nF-qTgAx2E_TYsQDW8LJoiXwJQ5S34orVvpw\u002Fexec',\n  \u002F\u002F Thông tin ngân hàng — VietQR sẽ sinh QR thật.\n  \u002F\u002F BIN code lấy từ Napas (https:\u002F\u002Fwww.vietqr.io\u002Fdanh-sach-ngan-hang).\n  \u002F\u002F Holder viết hoa không dấu để VietQR\u002Fapp ngân hàng hiển thị nhất quán.\n  BANK: {\n    name: 'VPBank',\n    bin: '970432',          \u002F\u002F mã BIN VietQR cho VPBank\n    account: '17129996',\n    holder: 'PHAM HAI TRUNG',\n  },\n  \u002F\u002F Menu theo từng sự kiện — fallback nếu Sheet `Menus` chưa có data.\n  \u002F\u002F Set ID dùng 1 ký tự uppercase ('A','B') để đồng bộ với backend (xem Menus tab).\n  \u002F\u002F Admin nên cập nhật qua Sheet `Menus` thay vì sửa code ở đây — State.menus\n  \u002F\u002F (pull từ getMenuStructure() backend) sẽ override mục này khi có data.\n  EVENT_MENUS: {\n    'e2026-06-06': {\n      price: 350000,\n      sets: [\n        { id: 'A', label: 'Set A', mainDish: 'Toát Gà Ngải Cứu', imageUrl: '' },\n        { id: 'B', label: 'Set B', mainDish: 'Mỳ Nấm Trứng Chảy', imageUrl: '' },\n      ],\n      drinks: [\n        { id: 'coldbrew-mo-muoi', label: 'Coldbrew Mơ Muối', type: 'non-alcoholic' },\n        { id: 'xoai-dao',         label: 'Xoài Đào',         type: 'non-alcoholic' },\n        { id: 'am-chen',          label: 'Ấm Chén',          type: 'cocktail' },\n        { id: 'green-flag',       label: 'Green Flag',       type: 'cocktail' },\n      ],\n      drinkRule: 'Chọn 1 trong 4',\n      sharedStarter: 'Nacho 2 loại sốt',\n      sharedDessert: 'Kem cốm Brulle',\n    },\n    'e2026-06-13': {\n      price: 350000,\n      sets: [\n        { id: 'A', label: 'Set A', mainDish: 'Burger Bò Tía Tô', imageUrl: '' },\n        { id: 'B', label: 'Set B', mainDish: 'Toast Tôm Ngò',   imageUrl: '' },\n      ],\n      drinks: [\n        { id: 'thanh-thanh-o-mai', label: 'Thanh thanh cùng ô mai', type: 'non-alcoholic' },\n        { id: 'dam-da-mo-vai',     label: 'Đậm đà cùng mơ vải',     type: 'non-alcoholic' },\n        { id: 'bia-dau',           label: 'Bia chay Dâu',           type: 'non-alcoholic' },\n        { id: 'bia-dao',           label: 'Bia chay Đào',           type: 'non-alcoholic' },\n        { id: 'am-chen',           label: 'Ấm Chén',                type: 'cocktail' },\n        { id: 'dont-tell-mom',     label: \"Don't Tell Mom\",         type: 'cocktail' },\n      ],\n      drinkRule: 'Chọn 1 trong 6',\n      sharedStarter: 'Salad Cà chua bi cùng sốt mùa Hạ',\n      sharedDessert: 'Lemon Pancake',\n    },\n  },\n  \u002F\u002F Fallback khi event không có menu trong EVENT_MENUS và Sheet Menus\n  DEFAULT_EVENT_MENU: {\n    price: 350000,\n    sets: [\n      { id: 'A', label: 'Set A', mainDish: '—', imageUrl: '' },\n      { id: 'B', label: 'Set B', mainDish: '—', imageUrl: '' },\n    ],\n    drinks: [],\n    drinkRule: '',\n    sharedStarter: '',\n    sharedDessert: '',\n  },\n};\n\n\u002F\u002F Sự kiện fallback nếu Sheet `Events` trống — đồng bộ với doc backend (4 thứ Bảy 6\u002F2026).\n\u002F\u002F label = tên sự kiện (hiển thị dòng đầu); date = ngày diễn ra (ISO YYYY-MM-DD).\n\u002F\u002F status: 'open' hiển thị, 'closed'\u002F'hidden' ẩn khỏi public.\nconst EVENTS_FALLBACK = [\n  { id: 'e2026-06-06', label: 'Dập Dìu Drag Brunch', date: '2026-06-06', status: 'open' },\n  { id: 'e2026-06-13', label: 'Dập Dìu Drag Brunch', date: '2026-06-13', status: 'open' },\n  { id: 'e2026-06-20', label: 'Dập Dìu Drag Brunch', date: '2026-06-20', status: 'closed' },\n  { id: 'e2026-06-27', label: 'Dập Dìu Drag Brunch', date: '2026-06-27', status: 'closed' },\n];\n\n\u002F\u002F Mapping legacy menu IDs (khi sheet Confirmed còn entry cũ) — chỉ để đọc, không tạo mới.\nconst MENUS_LEGACY = [\n  { id: 'veg', name: 'Set Chay' },\n  { id: 'std', name: 'Set Thường' },\n  { id: 'sea', name: 'Set Hải Sản' },\n];\n\n\u002F\u002F Decode 1 guest pick — hỗ trợ cả 2 format:\n\u002F\u002F   - Cũ: \"std\" \u002F \"sea\" \u002F \"veg\" → tra MENUS_LEGACY\n\u002F\u002F   - Mới: \"A:coldbrew-mo-muoi\" → tra getEventMenu(eventId)\n\u002F\u002F     (set ID 1 ký tự uppercase đồng bộ với backend Menus tab)\nfunction decodeGuestPick(raw, eventId) {\n  if (!raw) return '—';\n  if (raw.indexOf(':') >= 0) {\n    const parts = raw.split(':');\n    const setId = (parts[0] || '').toUpperCase();\n    const drinkId = parts[1] || '';\n    const menu = getEventMenu(eventId);\n    const setObj   = menu && (menu.sets   || []).find(s => String(s.id).toUpperCase() === setId);\n    const drinkObj = menu && (menu.drinks || []).find(d => d.id === drinkId);\n    const setName   = setObj   ? setObj.label : ('Set ' + setId);\n    const drinkName = drinkObj ? drinkObj.label : drinkId;\n    return drinkName ? (setName + ' · ' + drinkName) : setName;\n  }\n  const m = MENUS_LEGACY.find(x => x.id === raw);\n  return m ? m.name : raw;\n}\n\n\u002F\u002F Sơ đồ bàn mới (cập nhật 5\u002F2026):\n\u002F\u002F  - Khu A: A1-A5. Bàn chung (ngồi ghép): A1, A2, A3, A4. Bàn riêng: A5.\n\u002F\u002F  - Khu B: B1-B7. Bàn chung (ngồi ghép): B1, B7. Bàn riêng: B2-B6.\n\u002F\u002F  - cap = số khách tối đa, minCap = số khách tối thiểu để chọn bàn (range cap).\n\u002F\u002F    Vd B7 minCap=4 cap=5: nhóm 4 hoặc 5 đều chọn được.\n\u002F\u002F  - communal=true: mỗi click = chọn 1 ghế. Cho phép chia ghế giữa các bàn chung.\n\u002F\u002F  - room = \"Khu A\" hoặc \"Khu B\" (thay cho \"Gạch Bông\"\u002F\"Sàn Gỗ\" cũ).\nconst ALL_TABLES = [\n  \u002F\u002F Khu A\n  { id: 'A1', name: 'A1', room: 'Khu A', cap: 7, minCap: 1, communal: true  },\n  { id: 'A2', name: 'A2', room: 'Khu A', cap: 4, minCap: 1, communal: true  },\n  { id: 'A3', name: 'A3', room: 'Khu A', cap: 4, minCap: 1, communal: true  },\n  { id: 'A4', name: 'A4', room: 'Khu A', cap: 5, minCap: 1, communal: true  },\n  { id: 'A5', name: 'A5', room: 'Khu A', cap: 2, minCap: 2, communal: false },\n  \u002F\u002F Khu B\n  { id: 'B1', name: 'B1', room: 'Khu B', cap: 5, minCap: 1, communal: true  },\n  { id: 'B2', name: 'B2', room: 'Khu B', cap: 3, minCap: 2, communal: false },\n  { id: 'B3', name: 'B3', room: 'Khu B', cap: 2, minCap: 2, communal: false },\n  { id: 'B4', name: 'B4', room: 'Khu B', cap: 3, minCap: 2, communal: false },\n  { id: 'B5', name: 'B5', room: 'Khu B', cap: 3, minCap: 2, communal: false },\n  { id: 'B6', name: 'B6', room: 'Khu B', cap: 3, minCap: 2, communal: false },\n  { id: 'B7', name: 'B7', room: 'Khu B', cap: 5, minCap: 1, communal: true  },\n];\n\n\u002F\u002F ╔══════════════════════════════════════════════════════════════════════════╗\n\u002F\u002F ║  TABLE_LAYOUT — vị trí + kích thước từng bàn trong sơ đồ SVG.            ║\n\u002F\u002F ║  CHỈNH SỐ ở đây để dịch chuyển\u002Fco giãn bàn. Sau khi save, reload web.    ║\n\u002F\u002F ║  Hệ tọa độ: viewBox 800 × 290 (góc trên-trái = 0,0).                     ║\n\u002F\u002F ║                                                                          ║\n\u002F\u002F ║  Mỗi entry: { x, y, w, h, capLabel? }                                    ║\n\u002F\u002F ║    - x, y    : tọa độ góc trên-trái của bàn                              ║\n\u002F\u002F ║    - w, h    : chiều rộng × chiều cao bàn                                ║\n\u002F\u002F ║    - capLabel: chữ hiển thị bên dưới (mặc định lấy từ minCap–cap).       ║\n\u002F\u002F ║                                                                          ║\n\u002F\u002F ║  Bàn chung (A2, A3) — vị trí 4 ghế đơn được tự động sắp 2x2 trong bàn.   ║\n\u002F\u002F ║  Nếu muốn tuỳ chỉnh ghế, thêm seats: [{cx, cy}, ...] vào entry.          ║\n\u002F\u002F ╚══════════════════════════════════════════════════════════════════════════╝\nconst TABLE_LAYOUT = {\n  \u002F\u002F Khu A\n  A1: { x:  15, y:  20, w: 115, h:  95 },\n  A2: { x: 150, y:  20, w:  75, h:  90 },  \u002F\u002F communal\n  A3: { x: 240, y:  20, w:  75, h:  90 },  \u002F\u002F communal\n  A4: { x:  15, y: 170, w: 135, h:  95 },\n  A5: { x: 200, y: 175, w: 85, h:  60 },\n  \u002F\u002F Khu B\n  B1: { x: 460, y: 20, w: 80, h:  90 },\n  B2: { x: 560, y: 20, w: 85, h:  50 },\n  B3: { x: 670, y: 20, w: 90, h:  40 },\n  B4: { x: 690, y: 85, w: 90, h:  40 },\n  B5: { x: 460, y: 165, w: 60, h:  85 },\n  B6: { x: 570, y: 200, w: 90, h:  50 },\n  B7: { x: 705, y: 150, w: 90, h:  100 },\n};\n\n\u002F\u002F Background khu vực — chỉnh ở đây để dịch khu A\u002FB hoặc giếng trời.\nconst ROOM_LAYOUT = {\n  khuA: { x:   5, y: 10, w: 320, h: 265, fill: '#e9faf3', stroke: '#bfe9da', label: 'KHU A',  labelX:  20, labelY: 265, labelColor: '#0f9e76' },\n  khuB: { x: 450, y: 10, w: 345, h: 265, fill: '#fdf2cf', stroke: '#ecd9a6', label: 'KHU B',  labelX: 465, labelY: 265, labelColor: '#b07d00' },\n  well: { x: 335, y: 55, w: 105, h: 170, fill: '#efe7d6', stroke: '#ddd0b8', label: 'Giếng trời', labelX: 387, labelY: 145, labelColor: '#a98e6f' },\n};\n\n\u002F\u002F Render SVG động từ TABLE_LAYOUT + ROOM_LAYOUT. Gọi 1 lần khi init().\nfunction buildMapSvg() {\n  const svg = $('map-svg');\n  if (!svg) return;\n  const ns = 'http:\u002F\u002Fwww.w3.org\u002F2000\u002Fsvg';\n  const make = (tag, attrs) => {\n    const el = document.createElementNS(ns, tag);\n    for (const k in attrs) {\n      if (attrs[k] != null) el.setAttribute(k, attrs[k]);\n    }\n    return el;\n  };\n\n  \u002F\u002F Background rooms\n  ['khuA','well','khuB'].forEach(key => {\n    const r = ROOM_LAYOUT[key];\n    if (!r) return;\n    svg.appendChild(make('rect', {\n      x: r.x, y: r.y, width: r.w, height: r.h, rx: 8,\n      fill: r.fill, stroke: r.stroke, 'stroke-width': 0.8,\n    }));\n    if (r.label) {\n      const t = make('text', {\n        x: r.labelX, y: r.labelY,\n        'font-family': 'Be Vietnam Pro, sans-serif',\n        'font-size': 10,\n        'font-weight': key === 'well' ? 400 : 500,\n        'font-style': key === 'well' ? 'italic' : 'normal',\n        fill: r.labelColor,\n        'letter-spacing': key === 'well' ? '0' : '0.08em',\n        'text-anchor': key === 'well' ? 'middle' : 'start',\n      });\n      t.textContent = r.label;\n      svg.appendChild(t);\n    }\n  });\n\n  \u002F\u002F Bàn\n  ALL_TABLES.forEach(t => {\n    const cfg = TABLE_LAYOUT[t.id];\n    if (!cfg) { console.warn('Missing TABLE_LAYOUT for', t.id); return; }\n    const g = make('g', {\n      class: 'tbl-group tbl-available',\n      id: 'tbl-' + t.id,\n      'data-table': t.id,\n      tabindex: '0',\n      role: 'button',\n      'aria-label': 'Bàn ' + t.name + (t.communal ? ' (bàn chung, ' + t.cap + ' ghế đơn)' : (', ' + (t.minCap === t.cap ? t.cap : t.minCap + '-' + t.cap) + ' khách')),\n    });\n    \u002F\u002F Body\n    g.appendChild(make('rect', {\n      class: 'tbl-body' + (t.communal ? ' tbl-comm-body' : ''),\n      x: cfg.x, y: cfg.y, width: cfg.w, height: cfg.h, rx: 6,\n    }));\n    \u002F\u002F Tên bàn\n    const nameY = t.communal ? cfg.y + 18 : cfg.y + cfg.h \u002F 2 - 4;\n    const nameText = make('text', {\n      class: 'tbl-name',\n      x: cfg.x + cfg.w \u002F 2, y: nameY,\n      'font-family': 'Be Vietnam Pro, sans-serif',\n      'font-size': t.communal ? 13 : 14,\n      'font-weight': 500,\n      'text-anchor': 'middle',\n    });\n    nameText.textContent = t.name;\n    g.appendChild(nameText);\n\n    if (t.communal) {\n      \u002F\u002F Vẽ ghế đơn — sắp 2x2 (hoặc theo cfg.seats nếu có override)\n      const seats = cfg.seats || autoSeatPositions(cfg, t.cap);\n      seats.forEach((s, i) => {\n        g.appendChild(make('circle', {\n          class: 'seat',\n          'data-table': t.id,\n          'data-seat': i,\n          cx: s.cx, cy: s.cy, r: s.r || 7,\n        }));\n      });\n      \u002F\u002F Label \"0\u002F4 đã đặt\"\n      const cap = make('text', {\n        class: 'tbl-cap tbl-comm-cap',\n        x: cfg.x + cfg.w \u002F 2, y: cfg.y + cfg.h - 6,\n        'font-family': 'Be Vietnam Pro, sans-serif',\n        'font-size': 8,\n        'text-anchor': 'middle',\n      });\n      cap.textContent = tr('seats_taken', { used: 0, cap: t.cap });\n      g.appendChild(cap);\n    } else {\n      \u002F\u002F Bàn riêng — chỉ hiện cap label\n      const capStr = t.minCap === t.cap ? (t.cap + ' ' + tr('guests_unit')) : (t.minCap + '–' + t.cap + ' ' + tr('guests_unit'));\n      const cap = make('text', {\n        class: 'tbl-cap',\n        x: cfg.x + cfg.w \u002F 2, y: nameY + 18,\n        'font-family': 'Be Vietnam Pro, sans-serif',\n        'font-size': 9,\n        'text-anchor': 'middle',\n      });\n      cap.textContent = capStr;\n      g.appendChild(cap);\n    }\n    svg.appendChild(g);\n  });\n}\n\n\u002F\u002F Setup scroll hints cho map: gradient + hide khi đã scroll đến rìa.\n\u002F\u002F Gọi 1 lần sau buildMapSvg(). Tự re-evaluate khi resize (debounced).\nfunction setupMapScrollHints() {\n  const wrap = $('map-wrap');\n  const outer = wrap && wrap.parentElement;\n  if (!wrap || !outer) return;\n\n  const update = () => {\n    const max = wrap.scrollWidth - wrap.clientWidth;\n    if (max <= 4) {\n      \u002F\u002F SVG fit container → không scroll được, ẩn hết hints\n      wrap.classList.add('no-scroll');\n      wrap.classList.remove('scrolled-start', 'scrolled-end');\n      outer.classList.add('no-scroll');\n      outer.classList.remove('scrolled-end');\n      return;\n    }\n    wrap.classList.remove('no-scroll');\n    outer.classList.remove('no-scroll');\n    const sl = wrap.scrollLeft;\n    wrap.classList.toggle('scrolled-start', sl > 5);\n    const atEnd = sl >= max - 5;\n    wrap.classList.toggle('scrolled-end', atEnd);\n    outer.classList.toggle('scrolled-end', atEnd);\n  };\n\n  wrap.addEventListener('scroll', update, { passive: true });\n  \u002F\u002F Update khi window resize (debounce nhẹ)\n  let resizeTimer;\n  window.addEventListener('resize', () => {\n    clearTimeout(resizeTimer);\n    resizeTimer = setTimeout(update, 150);\n  });\n  \u002F\u002F Initial state — đợi 1 frame để layout ổn định\n  setTimeout(update, 50);\n}\n\n\u002F\u002F Auto-scroll preview: lần đầu user vào Step 3 trong session, animate scroll\n\u002F\u002F sang phải rồi quay lại để hint còn nội dung.\nlet _autoScrolledOnce = false;\nfunction autoScrollPreview() {\n  if (_autoScrolledOnce) return;\n  const wrap = $('map-wrap');\n  if (!wrap) return;\n  const max = wrap.scrollWidth - wrap.clientWidth;\n  if (max <= 4) return; \u002F\u002F Không cần preview nếu fit\n  _autoScrolledOnce = true;\n  \u002F\u002F Animate: 0 → max → 0 với delay\n  setTimeout(() => wrap.scrollTo({ left: max, behavior: 'smooth' }), 350);\n  setTimeout(() => wrap.scrollTo({ left: 0,   behavior: 'smooth' }), 1200);\n}\n\n\u002F\u002F Sắp ghế đơn cho bàn chung (A1-A4, B1, B7). Tối đa 2 hàng, tự canh theo kích thước bàn.\nfunction autoSeatPositions(cfg, cap) {\n  const n = Math.max(1, cap);\n  const padX = 15, topPad = 40, botPad = 16, r = 6;\n  const innerW = cfg.w - padX * 2;\n  const innerH = Math.max(20, cfg.h - topPad - botPad);\n  if (n <= 2) {\n    const cy = cfg.y + topPad + innerH \u002F 2;\n    if (n === 1) return [{ cx: cfg.x + cfg.w \u002F 2, cy, r }];\n    return [\n      { cx: cfg.x + padX + innerW * 0.25, cy, r },\n      { cx: cfg.x + padX + innerW * 0.75, cy, r },\n    ];\n  }\n  const cols = Math.ceil(n \u002F 2), rows = 2, pts = [];\n  for (let i = 0; i < n; i++) {\n    const row = Math.floor(i \u002F cols);\n    const idxInRow = i - row * cols;\n    const countInRow = (row === rows - 1) ? (n - cols) : cols;\n    const cw = innerW \u002F countInRow;\n    pts.push({\n      cx: cfg.x + padX + cw * (idxInRow + 0.5),\n      cy: cfg.y + topPad + innerH * (row + 0.5) \u002F rows,\n      r,\n    });\n  }\n  return pts;\n}\n\n\u002F\u002F === STATE ======================================================\nconst State = {\n  step: 1,\n  prevStep: 1,             \u002F\u002F theo dõi step trước → biết FE đang đi tới hay quay lại (giữ selection)\n  events: EVENTS_FALLBACK.slice(),\n  menus: [],               \u002F\u002F pull từ backend getMenuStructure() — mỗi entry = { eventId, sets:[...] }\n  date: null,\n  qty: 1,\n  selectedTableIds: [],\n  \u002F\u002F Bàn chung (communal): tracking riêng vì khách có thể chọn N ghế trong cùng 1 bàn,\n  \u002F\u002F hoặc chia ghế giữa nhiều bàn chung. Format: { A2: 2, A3: 1 } → tổng 3 ghế.\n  \u002F\u002F Khi 1 bàn có ≥1 ghế chọn, tableId cũng được push vào selectedTableIds (để render selected).\n  communalPicks: {},\n  guestSelections: [{ set: null, drink: null }],\n  \u002F\u002F Step 4 sub-flow:\n  \u002F\u002F   menuMode: 'wizard' = đang chọn menu cho từng khách; 'payment' = đã xong, hiện info+thanh toán.\n  \u002F\u002F   menuStep: index của khách đang được chọn trong wizard (0..qty-1).\n  menuMode: 'wizard',\n  menuStep: 0,\n  name: '', phone: '', email: '', note: '', ref: '',\n  \u002F\u002F Server data\n  confirmed: [],           \u002F\u002F booking[]\n  pending: [],             \u002F\u002F booking[] (đã filter expired)\n  \u002F\u002F UI\n  adminTab: 'pending',\n  adminToken: sessionStorage.getItem(CONFIG.KEY_ADMIN_TOKEN) || '',\n  countdownTimer: null,\n};\n\n\u002F\u002F === UTIL =======================================================\nconst $ = id => document.getElementById(id);\nconst fmt = n => (Number(n) || 0).toLocaleString('vi-VN') + ' ₫';\nconst getTable = id => ALL_TABLES.find(t => t.id === id);\nconst getEventPrice = () => {\n  const m = (CONFIG.EVENT_MENUS && CONFIG.EVENT_MENUS[State.date]);\n  return (m && m.price) || CONFIG.PRICE;\n};\nconst getTotal = () => getEventPrice() * State.qty;\nconst hasSheetUrl = () => CONFIG.SHEET_URL && !CONFIG.SHEET_URL.startsWith('PASTE');\n\nfunction genCode() {\n  \u002F\u002F 7 ký tự: 4 từ timestamp + 3 random từ crypto\n  const ts = Date.now().toString(36).toUpperCase().slice(-4);\n  const arr = new Uint8Array(2);\n  (window.crypto || window.msCrypto).getRandomValues(arr);\n  const rand = Array.from(arr).map(b => b.toString(36).toUpperCase().padStart(2,'0')).join('').slice(0,3);\n  return 'DD-' + ts + rand;\n}\n\nfunction genPaymentRef(code) {\n  \u002F\u002F Mã CK ngắn cho khách dễ điền (chỉ chữ + số, bỏ dấu gạch)\n  return code.replace(\u002F[^A-Z0-9]\u002Fg,'');\n}\n\nfunction isExpired(booking) {\n  if (booking.status !== 'pending') return false;\n  if (!booking.createdAt) return false;\n  const ageMs = Date.now() - new Date(booking.createdAt).getTime();\n  return ageMs > CONFIG.PENDING_TTL_MIN * 60 * 1000;\n}\n\nfunction normalizeBooking(r) {\n  let cs = r.communalSeats;\n  if (typeof cs === 'string') {\n    if (!cs.trim()) cs = {};\n    else { try { cs = JSON.parse(cs); } catch { cs = {}; } }\n  } else if (!cs || typeof cs !== 'object') cs = {};\n  return {\n    ...r,\n    tableIds: typeof r.tableIds === 'string' ? r.tableIds.split('|').filter(Boolean) : (r.tableIds || []),\n    guests:   typeof r.guests   === 'string' ? r.guests.split('|').filter(Boolean)   : (r.guests   || []),\n    qty:   Number(r.qty)   || 0,\n    total: Number(r.total) || 0,\n    communalSeats: cs,\n  };\n}\n\n\u002F\u002F === MODAL (thay native confirm\u002Fprompt) =========================\n\u002F\u002F Modal Promise-based — đẹp + responsive trên mobile, dùng cho cancel\u002Freject\u002Fdelete.\nfunction modalConfirm({ title, body, confirmText, cancelText, danger = false }) {\n  if (confirmText == null) confirmText = tr('ok_default');\n  if (cancelText == null) cancelText = tr('cancel_default');\n  return new Promise(resolve => {\n    const bd = document.createElement('div');\n    bd.className = 'modal-backdrop';\n    bd.innerHTML =\n      '<div class=\"modal-card\" role=\"dialog\" aria-modal=\"true\">' +\n        '<div class=\"modal-title\">' + escapeHtml(title || tr('confirm_default')) + '<\u002Fdiv>' +\n        (body ? '<div class=\"modal-body\">' + escapeHtml(body) + '<\u002Fdiv>' : '') +\n        '<div class=\"modal-actions\">' +\n          '<button type=\"button\" class=\"modal-btn\" data-mc=\"cancel\">' + escapeHtml(cancelText) + '<\u002Fbutton>' +\n          '<button type=\"button\" class=\"modal-btn ' + (danger ? 'danger' : 'primary') + '\" data-mc=\"ok\">' + escapeHtml(confirmText) + '<\u002Fbutton>' +\n        '<\u002Fdiv>' +\n      '<\u002Fdiv>';\n    document.body.appendChild(bd);\n    const close = (val) => { bd.remove(); resolve(val); };\n    bd.addEventListener('click', (e) => {\n      const t = e.target.closest('[data-mc]');\n      if (t) close(t.dataset.mc === 'ok');\n      else if (e.target === bd) close(false);\n    });\n    document.addEventListener('keydown', function esc(e) {\n      if (e.key === 'Escape') { document.removeEventListener('keydown', esc); close(false); }\n    });\n    setTimeout(() => bd.querySelector('[data-mc=\"ok\"]').focus(), 50);\n  });\n}\n\nfunction modalPrompt({ title, body, placeholder = '', inputType = 'text', okText }) {\n  if (okText == null) okText = tr('confirm_default');\n  return new Promise(resolve => {\n    const bd = document.createElement('div');\n    bd.className = 'modal-backdrop';\n    bd.innerHTML =\n      '<div class=\"modal-card\" role=\"dialog\" aria-modal=\"true\">' +\n        '<div class=\"modal-title\">' + escapeHtml(title || '') + '<\u002Fdiv>' +\n        (body ? '<div class=\"modal-body\">' + escapeHtml(body) + '<\u002Fdiv>' : '') +\n        '<input class=\"modal-input\" type=\"' + inputType + '\" placeholder=\"' + escapeHtml(placeholder) + '\" autofocus>' +\n        '<div class=\"modal-actions\">' +\n          '<button type=\"button\" class=\"modal-btn\" data-mc=\"cancel\">' + escapeHtml(tr('cancel_default')) + '<\u002Fbutton>' +\n          '<button type=\"button\" class=\"modal-btn primary\" data-mc=\"ok\">' + escapeHtml(okText) + '<\u002Fbutton>' +\n        '<\u002Fdiv>' +\n      '<\u002Fdiv>';\n    document.body.appendChild(bd);\n    const inp = bd.querySelector('.modal-input');\n    const close = (val) => { bd.remove(); resolve(val); };\n    bd.addEventListener('click', (e) => {\n      const t = e.target.closest('[data-mc]');\n      if (t === null && e.target === bd) return close(null);\n      if (!t) return;\n      if (t.dataset.mc === 'ok') close(inp.value.trim());\n      else close(null);\n    });\n    inp.addEventListener('keydown', (e) => {\n      if (e.key === 'Enter') close(inp.value.trim());\n      else if (e.key === 'Escape') close(null);\n    });\n    setTimeout(() => inp.focus(), 50);\n  });\n}\n\n\u002F\u002F === TOAST ======================================================\nfunction toast(msg, kind = 'info', ms = 3500) {\n  const host = $('toast-host');\n  const el = document.createElement('div');\n  el.className = 'toast' + (kind ? ' ' + kind : '');\n  el.textContent = msg;\n  host.appendChild(el);\n  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; }, ms - 300);\n  setTimeout(() => el.remove(), ms);\n}\n\n\u002F\u002F === STORAGE ====================================================\nfunction loadPendingLocal() {\n  let all;\n  try { all = JSON.parse(localStorage.getItem(CONFIG.KEY_PENDING_LOCAL) || '[]'); }\n  catch { return []; }\n  if (!Array.isArray(all)) return [];\n  \u002F\u002F Cleanup: loại bỏ các entry đã hết hạn để localStorage không phình mãi.\n  const fresh = all.filter(b => !isExpired(b));\n  if (fresh.length !== all.length) {\n    try { localStorage.setItem(CONFIG.KEY_PENDING_LOCAL, JSON.stringify(fresh)); } catch {}\n  }\n  return fresh;\n}\nfunction savePendingLocal(b) {\n  const a = loadPendingLocal();\n  if (!a.find(x => x.code === b.code)) a.push(b);\n  try { localStorage.setItem(CONFIG.KEY_PENDING_LOCAL, JSON.stringify(a)); } catch {}\n}\n\n\u002F\u002F === API ========================================================\nasync function api(action, payload = {}, opts = {}) {\n  if (!hasSheetUrl()) {\n    if (action === 'getAll') return { events: [], confirmed: [], pending: loadPendingLocal() };\n    return { ok: false, error: 'no-sheet-url' };\n  }\n  try {\n    if (opts.method === 'POST') {\n      const res = await fetch(CONFIG.SHEET_URL, {\n        method: 'POST',\n        headers: { 'Content-Type': 'text\u002Fplain' },\n        body: JSON.stringify({ action, ...payload }),\n      });\n      return await res.json();\n    } else {\n      const params = new URLSearchParams({ action, ...payload });\n      const res = await fetch(CONFIG.SHEET_URL + '?' + params.toString());\n      return await res.json();\n    }\n  } catch (e) {\n    console.warn('api error', action, e);\n    return { ok: false, error: e.message || 'network' };\n  }\n}\n\nasync function syncFromSheet() {\n  const data = await api('getAll');\n  if (data && Array.isArray(data.confirmed)) {\n    State.confirmed = data.confirmed.map(normalizeBooking);\n  }\n  if (data && Array.isArray(data.pending)) {\n    State.pending = data.pending.map(normalizeBooking).filter(b => !isExpired(b));\n  } else {\n    \u002F\u002F Fallback: dùng pending local\n    State.pending = loadPendingLocal().filter(b => !isExpired(b));\n  }\n  if (data && Array.isArray(data.events) && data.events.length) {\n    State.events = data.events.map(e => ({\n      id: String(e.id),\n      label: String(e.label),\n      date: e.date ? String(e.date) : '',\n      time: e.time ? String(e.time) : '',\n      capacity: Number(e.capacity) || 0,\n      status: (e.status ? String(e.status) : 'open').toLowerCase(),\n      order: Number(e.order) || 0,\n      lockedTables: Array.isArray(e.lockedTables) ? e.lockedTables.map(String)\n        : (e.lockedTables ? String(e.lockedTables).split(',').map(s => s.trim()).filter(Boolean) : []),\n    }));\n  }\n  \u002F\u002F Menus pull từ Sheet `Menus` (v4.1+). Khi tab này có data, sẽ override CONFIG.EVENT_MENUS.\n  if (data && Array.isArray(data.menus)) {\n    State.menus = data.menus;\n  }\n}\n\n\u002F\u002F === BUSINESS LOGIC ============================================\n\u002F\u002F Tổng số chỗ đơn đã đặt cho từng bàn chung (tính cả pending còn hạn + confirmed)\n\u002F\u002F Bàn admin khoá riêng cho 1 sự kiện (xem lockedTables của event) → coi như full.\nfunction lockedTablesFor(eventId) {\n  const ev = State.events.find(e => e.id === eventId);\n  return (ev && Array.isArray(ev.lockedTables)) ? ev.lockedTables : [];\n}\nfunction isTableLocked(tableId, eventId) {\n  return lockedTablesFor(eventId).indexOf(tableId) !== -1;\n}\n\nfunction communalOccupancy(eventId) {\n  const occ = {};\n  const all = [\n    ...State.confirmed.filter(b => b.eventId === eventId),\n    ...State.pending.filter(b => b.eventId === eventId && !isExpired(b)),\n  ];\n  all.forEach(b => {\n    const cs = b.communalSeats || {};\n    Object.keys(cs).forEach(id => {\n      occ[id] = (occ[id] || 0) + Number(cs[id] || 0);\n    });\n  });\n  return occ;\n}\n\nfunction remainingCommunal(tableId, eventId) {\n  const t = getTable(tableId);\n  if (!t || !t.communal) return 0;\n  const used = (communalOccupancy(eventId) || {})[tableId] || 0;\n  return Math.max(0, t.cap - used);\n}\n\n\u002F\u002F Bàn bị khoá = non-communal có người đặt + communal đã full\nfunction takenIds(eventId) {\n  const set = new Set();\n  const all = [\n    ...State.confirmed.filter(b => b.eventId === eventId),\n    ...State.pending.filter(b => b.eventId === eventId && !isExpired(b)),\n  ];\n  all.forEach(b => {\n    (b.tableIds || []).forEach(id => {\n      const t = getTable(id);\n      if (t && !t.communal) set.add(id);\n    });\n  });\n  \u002F\u002F Communal: chỉ khoá khi đã hết chỗ\n  const occ = communalOccupancy(eventId);\n  Object.keys(occ).forEach(id => {\n    const t = getTable(id);\n    if (t && t.communal && occ[id] >= t.cap) set.add(id);\n  });\n  \u002F\u002F Bàn bị admin khoá riêng → coi như full (khách không chọn được)\n  lockedTablesFor(eventId).forEach(id => { if (getTable(id)) set.add(id); });\n  return set;\n}\n\n\u002F\u002F Bàn pending (chỉ non-communal) để hiển thị màu vàng\nfunction pendingIds(eventId) {\n  const set = new Set();\n  State.pending.filter(b => b.eventId === eventId && !isExpired(b))\n    .forEach(b => (b.tableIds || []).forEach(id => {\n      const t = getTable(id);\n      if (t && !t.communal) set.add(id);\n    }));\n  return set;\n}\n\n\u002F\u002F Helpers tính capacity & status của selection.\n\u002F\u002F Bàn chung dùng State.communalPicks (số ghế đã chọn từng bàn);\n\u002F\u002F bàn riêng dùng State.selectedTableIds.\nfunction totalCommunalPicked() {\n  return Object.values(State.communalPicks).reduce((s, n) => s + Number(n || 0), 0);\n}\nfunction hasCommunalSelection() { return totalCommunalPicked() > 0; }\nfunction hasNonCommunalSelection() {\n  return State.selectedTableIds.some(id => {\n    const t = getTable(id);\n    return t && !t.communal;\n  });\n}\n\n\u002F\u002F Min\u002Fmax capacity chỉ tính cho non-communal selection (range cap kiểu 4-5).\nfunction selectedMinCap() {\n  return State.selectedTableIds.reduce((s, id) => {\n    const t = getTable(id);\n    if (!t || t.communal) return s;\n    return s + t.minCap;\n  }, 0);\n}\nfunction selectedMaxCap() {\n  return State.selectedTableIds.reduce((s, id) => {\n    const t = getTable(id);\n    if (!t || t.communal) return s;\n    return s + t.cap;\n  }, 0);\n}\n\nfunction isCompatible(tableId) {\n  const t = getTable(tableId);\n  if (!t) return false;\n  const taken = takenIds(State.date);\n  if (taken.has(tableId)) return false;\n\n  if (t.communal) {\n    \u002F\u002F Bàn chung: chọn được nếu chưa chọn bàn riêng + còn ≥ 1 ghế trống.\n    \u002F\u002F Cho phép chia ghế giữa nhiều bàn chung (vd 2 ghế A2 + 1 ghế A3).\n    if (hasNonCommunalSelection()) return false;\n    return remainingCommunal(tableId, State.date) > 0;\n  }\n  \u002F\u002F Bàn riêng: không cho ghép với communal selection\n  if (hasCommunalSelection()) return false;\n  if (State.selectedTableIds.includes(tableId)) return false;\n  return (selectedMinCap() + t.minCap) <= State.qty\n      && (selectedMaxCap() + t.cap) >= State.qty;\n}\n\nfunction selectionValid() {\n  if (hasCommunalSelection()) {\n    \u002F\u002F Communal mode: tổng ghế = qty và không có bàn riêng nào.\n    return !hasNonCommunalSelection() && totalCommunalPicked() === State.qty;\n  }\n  if (hasNonCommunalSelection()) {\n    return selectedMinCap() <= State.qty && selectedMaxCap() >= State.qty;\n  }\n  return false;\n}\n\n\u002F\u002F === RENDER: MAP ================================================\nfunction updateCommunalLabels() {\n  const occ = communalOccupancy(State.date);\n  ALL_TABLES.filter(t => t.communal).forEach(t => {\n    const used = isTableLocked(t.id, State.date) ? t.cap : ((occ[t.id] || 0) + Number(State.communalPicks[t.id] || 0));\n    const el = $('tbl-' + t.id);\n    if (!el) return;\n    const capText = el.querySelector('.tbl-comm-cap');\n    if (capText) capText.textContent = tr('seats_taken', { used: used, cap: t.cap });\n  });\n}\n\nfunction updateMapStates() {\n  const taken = takenIds(State.date);\n  const pending = pendingIds(State.date);\n  const confirmedNon = new Set();\n  State.confirmed.filter(b => b.eventId === State.date).forEach(b =>\n    (b.tableIds || []).forEach(id => {\n      const t = getTable(id);\n      if (t && !t.communal) confirmedNon.add(id);\n    }));\n  const occ = communalOccupancy(State.date);\n\n  ALL_TABLES.forEach(t => {\n    const el = $('tbl-' + t.id);\n    if (!el) return;\n    el.classList.remove('tbl-available','tbl-selected','tbl-compatible','tbl-dimmed','tbl-taken','tbl-pending');\n\n    if (t.communal) {\n      \u002F\u002F Render từng ghế đơn theo trạng thái (bàn khoá => coi như full)\n      const locked = isTableLocked(t.id, State.date);\n      const tableOcc = locked ? t.cap : (occ[t.id] || 0);\n      const myPicks = locked ? 0 : Number(State.communalPicks[t.id] || 0);\n      el.querySelectorAll('.seat').forEach((seatEl, i) => {\n        seatEl.classList.remove('seat-taken','seat-selected','seat-pending');\n        if (i < tableOcc)              seatEl.classList.add('seat-taken');\n        else if (i < tableOcc + myPicks) seatEl.classList.add('seat-selected');\n        \u002F\u002F else: free (default style)\n      });\n      \u002F\u002F Container box state\n      if (tableOcc >= t.cap) { el.classList.add('tbl-taken'); return; }\n      if (myPicks > 0)       { el.classList.add('tbl-selected'); return; }\n      if (hasNonCommunalSelection()) { el.classList.add('tbl-dimmed'); return; }\n      el.classList.add('tbl-available');\n      return;\n    }\n    \u002F\u002F Bàn riêng\n    if (confirmedNon.has(t.id)) { el.classList.add('tbl-taken'); return; }\n    if (pending.has(t.id))      { el.classList.add('tbl-pending'); return; }\n    if (State.selectedTableIds.includes(t.id)) { el.classList.add('tbl-selected'); return; }\n    if (hasCommunalSelection()) { el.classList.add('tbl-dimmed'); return; }\n    if (!hasNonCommunalSelection()) { el.classList.add('tbl-available'); return; }\n    el.classList.add(isCompatible(t.id) ? 'tbl-compatible' : 'tbl-dimmed');\n  });\n  updateCommunalLabels();\n  updateSelBar();\n}\n\nfunction updateSelBar() {\n  const bar = $('sel-bar'); const btn = $('btn3');\n  const hasComm = hasCommunalSelection();\n  const hasNon  = hasNonCommunalSelection();\n  if (!hasComm && !hasNon) {\n    bar.className = 'sel-bar';\n    bar.textContent = tr('sel_start');\n    btn.disabled = true; return;\n  }\n  if (hasComm) {\n    \u002F\u002F Render stepper +\u002F- cho mỗi bàn chung đã chọn ghế\n    const occ = communalOccupancy(State.date);\n    const steppers = Object.entries(State.communalPicks)\n      .filter(([_, n]) => Number(n) > 0)\n      .map(([id, n]) => {\n        const t = getTable(id);\n        const tableOcc = occ[id] || 0;\n        const canAdd = (tableOcc + Number(n)) < (t ? t.cap : 0) && totalCommunalPicked() < State.qty;\n        return '<span class=\"comm-stepper\">' +\n          '<span class=\"comm-stepper-label\">' + tr('n_seats_at', { n: n, id: id }) + '<\u002Fspan>' +\n          '<button class=\"comm-stepper-btn minus\" data-action=\"comm-minus\" data-table=\"' + id + '\" aria-label=\"' + tr('remove_seat', { id: id }) + '\">−<\u002Fbutton>' +\n          '<button class=\"comm-stepper-btn\" data-action=\"comm-plus\" data-table=\"' + id + '\" ' + (canAdd ? '' : 'disabled') + ' aria-label=\"' + tr('add_seat', { id: id }) + '\">+<\u002Fbutton>' +\n        '<\u002Fspan>';\n      });\n    const total = totalCommunalPicked();\n    let statusText;\n    if (total === State.qty) {\n      bar.className = 'sel-bar ok';\n      statusText = tr('enough_guests', { n: State.qty });\n      btn.disabled = false;\n    } else if (total < State.qty) {\n      bar.className = 'sel-bar partial';\n      statusText = tr('need_more_seats', { n: State.qty - total });\n      btn.disabled = true;\n    } else {\n      bar.className = 'sel-bar partial';\n      statusText = tr('too_many_seats', { n: total - State.qty });\n      btn.disabled = true;\n    }\n    bar.innerHTML = '<div class=\"comm-steppers\">' + steppers.join('') + '<\u002Fdiv>' + statusText;\n    return;\n  }\n  \u002F\u002F Non-communal mode\n  const names = State.selectedTableIds.map(id => getTable(id).name).join(' + ');\n  const mx = selectedMaxCap();\n  const selLabel = '<b>' + tr('selected') + ':<\u002Fb> ' + names + ' — ';\n  if (selectionValid()) {\n    bar.className = 'sel-bar ok';\n    bar.innerHTML = selLabel + tr('enough_for', { n: State.qty });\n    btn.disabled = false;\n  } else if (mx < State.qty) {\n    bar.className = 'sel-bar partial';\n    bar.innerHTML = selLabel + tr('need_more_spots', { n: State.qty - mx });\n    btn.disabled = true;\n  } else {\n    bar.className = 'sel-bar partial';\n    bar.innerHTML = selLabel + tr('mismatch', { n: State.qty });\n    btn.disabled = true;\n  }\n}\n\n\u002F\u002F Thêm 1 ghế vào bàn chung. Đây là primary action — click table body hoặc click seat\n\u002F\u002F trống đều gọi hàm này. Để bỏ ghế dùng stepper +\u002F- ở sel-bar (rõ ràng hơn).\nfunction addCommunalSeat(tableId) {\n  const t = getTable(tableId);\n  if (!t || !t.communal) return;\n  if (hasNonCommunalSelection()) {\n    toast(tr('toast_has_private'), 'warn');\n    return;\n  }\n  const occ = (communalOccupancy(State.date) || {})[tableId] || 0;\n  const myPicks = Number(State.communalPicks[tableId] || 0);\n  if (occ + myPicks >= t.cap) {\n    toast(tr('toast_table_full', { name: t.name }), 'warn');\n    return;\n  }\n  if (totalCommunalPicked() >= State.qty) {\n    toast(tr('toast_seats_full', { n: State.qty }), 'warn');\n    return;\n  }\n  State.communalPicks[tableId] = myPicks + 1;\n  if (!State.selectedTableIds.includes(tableId)) {\n    State.selectedTableIds.push(tableId);\n  }\n  updateMapStates();\n}\n\n\u002F\u002F Bỏ 1 ghế khỏi bàn chung (gọi từ stepper − trong sel-bar).\nfunction removeCommunalSeat(tableId) {\n  const myPicks = Number(State.communalPicks[tableId] || 0);\n  if (myPicks <= 0) return;\n  State.communalPicks[tableId] = myPicks - 1;\n  if (State.communalPicks[tableId] === 0) {\n    delete State.communalPicks[tableId];\n    State.selectedTableIds = State.selectedTableIds.filter(id => id !== tableId);\n  }\n  updateMapStates();\n}\n\nfunction tableClick(id) {\n  const taken = takenIds(State.date);\n  if (taken.has(id)) {\n    toast(tr('toast_table_taken'), 'warn');\n    return;\n  }\n  const t = getTable(id);\n  if (!t) return;\n\n  if (t.communal) {\n    \u002F\u002F Click body hoặc seat: đều cộng 1 ghế. Bỏ ghế dùng stepper − ở sel-bar.\n    return addCommunalSeat(id);\n  }\n\n  \u002F\u002F Non-communal logic (giữ cũ): toggle bàn\n  if (State.selectedTableIds.includes(id)) {\n    State.selectedTableIds = State.selectedTableIds.filter(x => x !== id);\n    updateMapStates();\n    return;\n  }\n  const el = $('tbl-' + id);\n  if (el && el.classList.contains('tbl-dimmed')) return;\n  State.selectedTableIds.push(id);\n  updateMapStates();\n}\n\n\u002F\u002F Tổng chỗ còn trống cho 1 event — bàn chung tính theo chỗ còn lại\nfunction eventTotalAvailable(eventId) {\n  const taken = takenIds(eventId);\n  const occ = communalOccupancy(eventId);\n  let total = 0;\n  ALL_TABLES.forEach(t => {\n    if (taken.has(t.id)) return;\n    if (t.communal) total += Math.max(0, t.cap - (occ[t.id] || 0));\n    else total += t.cap;\n  });\n  return total;\n}\n\n\u002F\u002F === RENDER: DATES ==============================================\nfunction fmtEventDate(iso) {\n  if (!iso) return '';\n  const m = String(iso).match(\u002F^(\\d{4})-(\\d{2})-(\\d{2})\u002F);\n  if (!m) return String(iso);\n  const y = +m[1], mo = +m[2], d = +m[3];\n  const dow = new Date(y, mo - 1, d).getDay();\n  const dayName = tr('days')[dow];\n  if (LANG === 'en') {\n    return dayName + ', ' + d + ' ' + tr('months')[mo - 1] + ' ' + y;\n  }\n  return dayName + ', ' + d + '\u002F' + mo + '\u002F' + y;\n}\n\n\u002F\u002F Lấy ngày diễn ra sự kiện dạng ISO YYYY-MM-DD.\n\u002F\u002F Ưu tiên ev.date; nếu trống\u002Fbất thường, thử suy ra từ id (\"e2026-06-13\" → \"2026-06-13\").\nfunction getEventDate(ev) {\n  if (!ev) return '';\n  \u002F\u002F 1) ev.date có sẵn dạng ISO\n  if (ev.date) {\n    const s = String(ev.date);\n    const iso = s.match(\u002F(\\d{4}-\\d{2}-\\d{2})\u002F);\n    if (iso) return iso[1];\n    \u002F\u002F Apps Script có thể trả về Date object → toString = \"Sat Jun 13 2026 ...\"\n    \u002F\u002F Hoặc dạng dd\u002Fmm\u002Fyyyy\n    const dmy = s.match(\u002F(\\d{1,2})\\\u002F(\\d{1,2})\\\u002F(\\d{4})\u002F);\n    if (dmy) {\n      const d = String(dmy[1]).padStart(2,'0');\n      const m = String(dmy[2]).padStart(2,'0');\n      return dmy[3] + '-' + m + '-' + d;\n    }\n    \u002F\u002F Fallback: parse bằng Date\n    const t = new Date(s);\n    if (!isNaN(t.getTime())) {\n      return t.getFullYear() + '-' +\n        String(t.getMonth() + 1).padStart(2,'0') + '-' +\n        String(t.getDate()).padStart(2,'0');\n    }\n  }\n  \u002F\u002F 2) Suy từ id (dạng e2026-06-13)\n  const fromId = String(ev.id || '').match(\u002F(\\d{4}-\\d{2}-\\d{2})\u002F);\n  return fromId ? fromId[1] : '';\n}\n\n\u002F\u002F Path con dấu (seal) 12 cánh sóng — viewBox 0 0 100 100, dùng lại cho date seal.\nconst SEAL_PATH = (function () {\n  const cx = 50, cy = 50, rO = 49, rI = 40, pts = 12;\n  let d = '';\n  for (let i = 0; i < pts * 2; i++) {\n    const ang = (Math.PI \u002F pts) * i - Math.PI \u002F 2;\n    const r = (i % 2 === 0) ? rO : rI;\n    d += (i === 0 ? 'M' : 'L') + (cx + Math.cos(ang) * r).toFixed(2) + ' ' + (cy + Math.sin(ang) * r).toFixed(2) + ' ';\n  }\n  return d + 'Z';\n})();\nfunction dateSealHtml(full, n) {\n  const fill = full ? '#7a0000' : '#1feab0';\n  const num  = full ? (LANG === 'en' ? 'X' : '×') : n;\n  const sub  = full ? (LANG === 'en' ? 'Full' : 'Hết') : (LANG === 'en' ? 'left' : 'chỗ');\n  return '<span class=\"date-seal' + (full ? ' full-seal' : '') + '\" aria-hidden=\"true\">' +\n    '<svg viewBox=\"0 0 100 100\"><path d=\"' + SEAL_PATH + '\" fill=\"' + fill + '\" stroke=\"rgba(0,0,0,0.06)\" stroke-width=\"1\"\u002F><\u002Fsvg>' +\n    '<span class=\"ds-num\">' + num + '<\u002Fspan><span class=\"ds-sub\">' + sub + '<\u002Fspan><\u002Fspan>';\n}\n\nfunction renderDates() {\n  const grid = $('date-grid');\n  grid.innerHTML = '';\n  State.events.filter(ev => (ev.status || 'open') !== 'closed').forEach(ev => {\n    const totalCap = eventTotalAvailable(ev.id);\n    const full = totalCap <= 0;\n    const btn = document.createElement('button');\n    btn.className = 'date-btn' + (full ? ' full' : '');\n    btn.id = 'dt-' + ev.id;\n    btn.dataset.event = ev.id;\n    \u002F\u002F Cấu trúc: [tên sự kiện + ngày] bên trái, [con dấu mint số chỗ] bên phải.\n    const isoDate = getEventDate(ev);\n    const dateText = isoDate ? fmtEventDate(isoDate) : '';\n    const dateLine = dateText ? '<span class=\"dd\">' + escapeHtml(dateText) + '<\u002Fspan>' : '';\n    btn.innerHTML =\n      '<span class=\"date-main\">' +\n        '<span class=\"dm\">' + escapeHtml(ev.label) + '<\u002Fspan>' +\n        dateLine +\n      '<\u002Fspan>' +\n      dateSealHtml(full, totalCap);\n    grid.appendChild(btn);\n  });\n}\n\nfunction selectDate(id) {\n  State.date = id;\n  State.selectedTableIds = [];\n  document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('sel'));\n  const el = $('dt-' + id);\n  if (el) el.classList.add('sel');\n  setTimeout(() => goStep(2), 180);\n}\n\n\u002F\u002F === STEP 2: QTY ================================================\nfunction maxAvailQty() {\n  return eventTotalAvailable(State.date);\n}\nfunction updateQtyHint() {\n  const max = maxAvailQty();\n  $('qty-hint').textContent = tr('max_spots', { n: max });\n  $('qminus').disabled = State.qty <= 1;\n  $('qplus').disabled = State.qty >= max;\n}\nfunction changeQty(d) {\n  const max = maxAvailQty();\n  const nq = Math.max(1, Math.min(State.qty + d, max));\n  if (nq === State.qty) return;\n  State.qty = nq;\n  while (State.guestSelections.length < State.qty) State.guestSelections.push({ set: null, drink: null });\n  State.guestSelections = State.guestSelections.slice(0, State.qty);\n  $('qty-disp').textContent = State.qty;\n  updateQtyHint();\n}\n\n\u002F\u002F === STEP 4: MENU + FORM ========================================\n\u002F\u002F Map cấu trúc menu BE (từ getMenuStructure):\n\u002F\u002F   { eventId, sets: [{ id, starter, main, dessert, drinks: [...] }] }\n\u002F\u002F về cấu trúc FE đang dùng:\n\u002F\u002F   { sets: [{ id, label, mainDish }], drinks: [...], sharedStarter, sharedDessert, drinkRule }\n\u002F\u002F BE design: starter & dessert thường shared giữa các set → lấy từ set đầu tiên có dữ liệu.\nfunction mapBackendMenu(beMenu) {\n  if (!beMenu || !Array.isArray(beMenu.sets) || !beMenu.sets.length) return null;\n  const sets = beMenu.sets.map(s => ({\n    id: String(s.id || '').toUpperCase(),\n    label: 'Set ' + String(s.id || '').toUpperCase(),\n    mainDish: (s.main && s.main.itemName) || '—',\n    \u002F\u002F imageUrl pull từ Sheet `Menus` cột imageUrl (chỉ ở row có course='main' của set đó).\n    imageUrl: (s.main && s.main.imageUrl) || '',\n  }));\n  \u002F\u002F Drinks: gộp tất cả drinks từ các set (thường giống nhau giữa Set A\u002FB).\n  \u002F\u002F Dedupe theo itemId, ưu tiên drink xuất hiện đầu tiên.\n  const drinkMap = {};\n  beMenu.sets.forEach(s => (s.drinks || []).forEach(d => {\n    if (d.itemId && !drinkMap[d.itemId]) {\n      drinkMap[d.itemId] = {\n        id: d.itemId,\n        label: d.itemName || d.itemId,\n        type: d.tag === 'alcohol' ? 'cocktail' : (d.tag === 'zeroproof' ? 'non-alcoholic' : 'non-alcoholic'),\n      };\n    }\n  }));\n  const drinks = Object.values(drinkMap);\n  \u002F\u002F Shared starter\u002Fdessert: lấy từ set đầu có data.\n  const firstWithStarter = beMenu.sets.find(s => s.starter && s.starter.itemName);\n  const firstWithDessert = beMenu.sets.find(s => s.dessert && s.dessert.itemName);\n  return {\n    price: 350000,\n    sets,\n    drinks,\n    drinkRule: drinks.length ? ('Chọn 1 trong ' + drinks.length) : '',\n    sharedStarter: firstWithStarter ? firstWithStarter.starter.itemName : '',\n    sharedDessert: firstWithDessert ? firstWithDessert.dessert.itemName : '',\n  };\n}\n\n\u002F\u002F Lấy menu cho 1 event. Thứ tự ưu tiên:\n\u002F\u002F   1. Sheet `Menus` (qua State.menus) — admin sửa Sheet không cần redeploy.\n\u002F\u002F   2. CONFIG.EVENT_MENUS hard-coded (fallback).\n\u002F\u002F   3. CONFIG.DEFAULT_EVENT_MENU (cuối cùng).\nfunction getEventMenu(eventId) {\n  const fromSheet = (State.menus || []).find(m => m.eventId === eventId);\n  if (fromSheet) {\n    const mapped = mapBackendMenu(fromSheet);\n    if (mapped) return mapped;\n  }\n  return (CONFIG.EVENT_MENUS && CONFIG.EVENT_MENUS[eventId]) || CONFIG.DEFAULT_EVENT_MENU;\n}\n\nfunction allSetsChosen() {\n  return State.guestSelections.length === State.qty &&\n    State.guestSelections.every(g => !!g.set);\n}\nfunction allDrinksChosen() {\n  const menu = getEventMenu(State.date);\n  if (!menu.drinks || !menu.drinks.length) return true;\n  return State.guestSelections.length === State.qty &&\n    State.guestSelections.every(g => !!g.drink);\n}\nfunction step4MenuComplete() { return allSetsChosen() && allDrinksChosen(); }\n\nfunction renderMenuBanner() {\n  const menu = getEventMenu(State.date);\n  $('menu-banner').innerHTML = (menu.sets || []).map(s => {\n    const img = s.imageUrl\n      ? '<div class=\"menu-card-img\"><img src=\"' + s.imageUrl + '\" alt=\"' + s.label + '\" loading=\"lazy\"><\u002Fdiv>'\n      : '<div class=\"menu-card-img\">' + tr('illustration') + '<\u002Fdiv>';\n    return '<div class=\"menu-card\">' + img +\n      '<div class=\"menu-card-body\">' +\n        '<div class=\"menu-card-set\">' + s.label + '<\u002Fdiv>' +\n        '<div class=\"menu-card-dish\">' + s.mainDish + '<\u002Fdiv>' +\n      '<\u002Fdiv><\u002Fdiv>';\n  }).join('');\n  const sharedParts = [];\n  if (menu.sharedStarter) sharedParts.push(tr('starter_lbl') + ': ' + menu.sharedStarter);\n  if (menu.sharedDessert) sharedParts.push(tr('dessert_lbl') + ': ' + menu.sharedDessert);\n  $('menu-shared').textContent = sharedParts.join(' · ');\n  $('menu-shared').style.display = sharedParts.length ? '' : 'none';\n}\n\n\u002F\u002F Render per-guest cards (style từ \"index menu.html\"): mỗi khách 1 card\n\u002F\u002F gồm set picker (Set A \u002F Set B), set detail, và dropdown đồ uống.\n\u002F\u002F Render card chọn menu cho 1 khách. Trong wizard mode, chỉ render khách\n\u002F\u002F theo State.menuStep. Trong review mode (xem trước thanh toán), không gọi hàm này.\nfunction renderGuestRows() {\n  const menu = getEventMenu(State.date);\n  const el = $('guest-rows');\n  const i = State.menuStep;\n  const g = State.guestSelections[i] || { set: null, drink: null };\n  const setObj = g.set ? (menu.sets || []).find(s => s.id === g.set) : null;\n\n  \u002F\u002F 1) Set picker (2-column grid: tag + tên món chính)\n  const setBtns = (menu.sets || []).map(s => {\n    const main = s.mainDish || '—';\n    return '<button type=\"button\" class=\"gcard-set' + (g.set === s.id ? ' sel' : '') + '\" ' +\n      'data-action=\"pick-set\" data-guest=\"' + i + '\" data-set=\"' + s.id + '\">' +\n      '<span class=\"gcard-set-tag\">' + escapeHtml(s.label) + '<\u002Fspan>' +\n      '<span class=\"gcard-set-main\">' + escapeHtml(main) + '<\u002Fspan>' +\n    '<\u002Fbutton>';\n  }).join('');\n\n  let detailHtml = '';\n  let drinkHtml = '';\n\n  if (setObj) {\n    \u002F\u002F 2) Set detail\n    const lines = [];\n    if (menu.sharedStarter) lines.push('<div><span class=\"gcard-dlbl\">' + tr('starter_lbl') + '<\u002Fspan> ' + escapeHtml(menu.sharedStarter) + '<\u002Fdiv>');\n    lines.push('<div><span class=\"gcard-dlbl\">' + tr('main_lbl') + '<\u002Fspan> ' + escapeHtml(setObj.mainDish || '—') + '<\u002Fdiv>');\n    if (menu.sharedDessert) lines.push('<div><span class=\"gcard-dlbl\">' + tr('dessert_lbl') + '<\u002Fspan> ' + escapeHtml(menu.sharedDessert) + '<\u002Fdiv>');\n    detailHtml = '<div class=\"gcard-detail\">' + lines.join('') + '<\u002Fdiv>';\n\n    \u002F\u002F 3) Drink dropdown\n    if (menu.drinks && menu.drinks.length) {\n      const opts = ['<option value=\"\">' + tr('choose_drink_opt') + '<\u002Foption>']\n        .concat(menu.drinks.map(d => {\n          let label = d.label;\n          if (d.type === 'cocktail')          label += ' · ' + tr('alcoholic');\n          else if (d.type === 'non-alcoholic') label += ' · ' + tr('zero_alc');\n          return '<option value=\"' + escapeHtml(d.id) + '\"' +\n            (g.drink === d.id ? ' selected' : '') + '>' + escapeHtml(label) + '<\u002Foption>';\n        })).join('');\n\n      let badge = '';\n      if (g.drink) {\n        const chosen = menu.drinks.find(d => d.id === g.drink);\n        if (chosen && chosen.type) {\n          const cls = chosen.type === 'cocktail' ? 'badge-alcohol' : 'badge-zeroproof';\n          const txt = chosen.type === 'cocktail' ? tr('alcoholic') : tr('zero_alc');\n          badge = '<span class=\"gcard-drink-badge ' + cls + '\">' + txt + '<\u002Fspan>';\n        }\n      }\n      \u002F\u002F Rule text (vd \"Chọn 1 trong 5\") đưa vào ngay cạnh label đồ uống thay vì trên đầu menu —\n      \u002F\u002F tránh khách nhầm là rule áp dụng cho việc chọn set.\n      const ruleInline = (menu.drinks && menu.drinks.length)\n        ? ' <span style=\"color:var(--text3);font-weight:400;font-size:11px;\">· ' + escapeHtml(tr('drink_rule', { n: menu.drinks.length })) + '<\u002Fspan>'\n        : '';\n      drinkHtml = '<div class=\"gcard-drink\">' +\n        '<label class=\"il\">' + tr('drinks_lbl') + ' <span class=\"il-req\">*<\u002Fspan>' + ruleInline + '<\u002Flabel>' +\n        '<select class=\"gsel\" data-action=\"pick-drink\" data-guest=\"' + i + '\">' + opts + '<\u002Fselect>' +\n        badge +\n      '<\u002Fdiv>';\n    }\n  } else {\n    detailHtml = '<div class=\"gcard-hint\">' + tr('pick_set_hint') + '<\u002Fdiv>';\n  }\n\n  el.innerHTML = '<div class=\"gcard\">' +\n    '<div class=\"gcard-hdr\">' + tr('guest_n', { n: i + 1 }) + '<\u002Fdiv>' +\n    '<div class=\"gcard-sets\">' + setBtns + '<\u002Fdiv>' +\n    detailHtml +\n    drinkHtml +\n  '<\u002Fdiv>';\n}\n\n\u002F\u002F Check khách hiện tại đã chọn xong chưa (set + drink nếu menu yêu cầu)\nfunction currentGuestComplete() {\n  const g = State.guestSelections[State.menuStep];\n  if (!g || !g.set) return false;\n  const menu = getEventMenu(State.date);\n  if (menu.drinks && menu.drinks.length && !g.drink) return false;\n  return true;\n}\n\n\u002F\u002F Render header của wizard: \"Khách 2 \u002F 4\" + dots\nfunction renderMenuWizardNav() {\n  $('menu-wizard-counter').textContent = tr('guest_counter', { a: State.menuStep + 1, b: State.qty });\n  const dots = Array.from({ length: State.qty }, (_, i) => {\n    const g = State.guestSelections[i];\n    const done = g && g.set && (!getEventMenu(State.date).drinks?.length || g.drink);\n    let cls = '';\n    if (i === State.menuStep) cls = 'sel';\n    else if (done) cls = 'done';\n    return '<span class=\"menu-wizard-dot ' + cls + '\"><\u002Fspan>';\n  }).join('');\n  $('menu-wizard-dots').innerHTML = dots;\n  \u002F\u002F Buttons\n  const prevBtn = $('menu-prev-btn');\n  const nextBtn = $('menu-next-btn');\n  prevBtn.textContent = State.menuStep === 0 ? tr('back_map_short') : tr('prev_guest', { n: State.menuStep });\n  nextBtn.textContent = State.menuStep < State.qty - 1\n    ? tr('next_guest', { n: State.menuStep + 2 })\n    : tr('to_payment');\n  nextBtn.disabled = !currentGuestComplete();\n}\n\n\u002F\u002F Bấm Tiếp \u002F Trước\nfunction menuNext() {\n  if (!currentGuestComplete()) {\n    toast(tr('toast_pick_first'), 'warn');\n    return;\n  }\n  if (State.menuStep < State.qty - 1) {\n    State.menuStep++;\n    renderGuestRows();\n    renderMenuWizardNav();\n    scrollMenuIntoView();\n  } else {\n    enterMenuPayment();\n  }\n}\n\nfunction menuPrev() {\n  if (State.menuStep > 0) {\n    State.menuStep--;\n    renderGuestRows();\n    renderMenuWizardNav();\n    scrollMenuIntoView();\n  } else {\n    goStep(3);\n  }\n}\n\nfunction scrollMenuIntoView() {\n  const el = $('menu-wizard');\n  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });\n}\n\n\u002F\u002F Vào mode wizard\nfunction enterMenuWizard(stepIdx) {\n  State.menuMode = 'wizard';\n  if (typeof stepIdx === 'number') State.menuStep = Math.max(0, Math.min(stepIdx, State.qty - 1));\n  $('menu-wizard').classList.remove('hidden');\n  $('menu-review').classList.add('hidden');\n  $('info-payment-wrap').classList.add('hidden');\n  $('menu-card-lbl').textContent = tr('menu_card_wizard');\n  renderGuestRows();\n  renderMenuWizardNav();\n}\n\n\u002F\u002F Chuyển sang mode payment (đã chọn xong tất cả khách)\nfunction enterMenuPayment() {\n  if (!step4MenuComplete()) {\n    toast(tr('toast_complete_menu'), 'warn');\n    return;\n  }\n  State.menuMode = 'payment';\n  $('menu-wizard').classList.add('hidden');\n  $('menu-review').classList.remove('hidden');\n  $('info-payment-wrap').classList.remove('hidden');\n  $('menu-card-lbl').textContent = tr('menu_chosen');\n  renderMenuReview();\n  validateForm();\n  \u002F\u002F Scroll xuống phần info để khách thấy tiếp\n  setTimeout(() => {\n    const el = $('info-payment-wrap');\n    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });\n  }, 50);\n}\n\n\u002F\u002F Sửa lại menu — quay về wizard\nfunction menuEdit() {\n  enterMenuWizard(0);\n}\n\n\u002F\u002F Render danh sách menu đã chọn (review mode — sau wizard)\nfunction renderMenuReview() {\n  const menu = getEventMenu(State.date);\n  const lines = State.guestSelections.map((g, i) => {\n    const setObj   = (menu.sets   || []).find(s => s.id === g.set);\n    const drinkObj = (menu.drinks || []).find(d => d.id === g.drink);\n    const setName = setObj ? (setObj.label + (setObj.mainDish ? ' · ' + setObj.mainDish : '')) : '—';\n    const drinkName = drinkObj ? drinkObj.label : '';\n    const pickHtml = drinkName\n      ? escapeHtml(setName) + '<br><span style=\"color:var(--text2);font-weight:400;font-size:12px;\">' + escapeHtml(drinkName) + '<\u002Fspan>'\n      : escapeHtml(setName);\n    return '<div class=\"ms-row\">' +\n      '<span class=\"ms-name\">' + tr('guest_n', { n: i + 1 }) + '<\u002Fspan>' +\n      '<span class=\"ms-pick\">' + pickHtml + '<\u002Fspan>' +\n    '<\u002Fdiv>';\n  }).join('');\n  $('menu-summary-list').innerHTML = lines;\n}\n\nfunction renderStep4Menu() {\n  \u002F\u002F Hiển thị recap khác nhau cho 2 mode:\n  \u002F\u002F   - Communal: \"2 ghế A2, 1 ghế A3\"\n  \u002F\u002F   - Non-communal: \"A1 · Khu A + A4 · Khu A\"\n  if (hasCommunalSelection()) {\n    const parts = Object.entries(State.communalPicks)\n      .filter(([_, n]) => Number(n) > 0)\n      .map(([id, n]) => '<b>' + tr('n_seats_at', { n: n, id: id }) + '<\u002Fb>');\n    $('recap-bar').innerHTML = parts.join(' &nbsp;+&nbsp; ');\n  } else {\n    $('recap-bar').innerHTML = State.selectedTableIds.map(id => {\n      const t = getTable(id); return '<b>' + t.name + '<\u002Fb> · ' + roomName(t.room);\n    }).join(' &nbsp;+&nbsp; ');\n  }\n  \u002F\u002F Đảm bảo guestSelections có đúng số phần tử\n  while (State.guestSelections.length < State.qty) State.guestSelections.push({ set: null, drink: null });\n  State.guestSelections = State.guestSelections.slice(0, State.qty);\n  renderMenuBanner();\n  \u002F\u002F Reset wizard về khách 1 mỗi lần vào step 4\n  State.menuStep = 0;\n  enterMenuWizard(0);\n  $('total-disp').textContent = fmt(getTotal());\n}\n\nfunction pickSet(guestIdx, setId) {\n  const sel = State.guestSelections[guestIdx];\n  if (!sel) return;\n  if (sel.set === setId) return;\n  sel.set = setId;\n  \u002F\u002F Reset drink khi đổi set (đảm bảo guest chủ động chọn lại)\n  sel.drink = null;\n  renderGuestRows();\n  renderMenuWizardNav();  \u002F\u002F update enable\u002Fdisable nút Tiếp\n  validateForm();\n}\n\nfunction pickDrink(guestIdx, drinkId) {\n  const sel = State.guestSelections[guestIdx];\n  if (!sel) return;\n  sel.drink = drinkId || null;\n  renderGuestRows();\n  renderMenuWizardNav();\n  validateForm();\n}\n\nconst RE_EMAIL = \u002F^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$\u002F;\nconst RE_PHONE = \u002F^0\\d{9,10}$\u002F;\n\nfunction validateForm() {\n  State.name  = $('inp-name').value.trim();\n  State.phone = $('inp-phone').value.trim().replace(\u002F\\s+\u002Fg,'');\n  State.email = $('inp-email').value.trim();\n  State.note  = $('inp-note').value.trim();\n\n  const errors = {};\n  if (!State.name) errors.name = tr('err_name');\n  if (!RE_PHONE.test(State.phone)) errors.phone = tr('err_phone');\n  if (!RE_EMAIL.test(State.email)) errors.email = tr('err_email');\n\n  ['name','phone','email'].forEach(f => {\n    const inp = $('inp-' + f); const err = $('err-' + f);\n    if (errors[f]) { inp.classList.add('invalid'); err.textContent = errors[f]; }\n    else { inp.classList.remove('invalid'); err.textContent = ''; }\n  });\n\n  \u002F\u002F Sinh mã + ref khi form đã có SĐT hợp lệ\n  if (!State.ref && RE_PHONE.test(State.phone)) {\n    const code = genCode();\n    State.ref = genPaymentRef(code);\n    State._previewCode = code;\n  }\n  renderSummary();\n  $('pay-ref').textContent  = State.ref || '—';\n  $('pay-total').textContent = fmt(getTotal());\n  $('total-disp').textContent = fmt(getTotal());\n  renderQR();\n  $('btn4').disabled = Object.keys(errors).length > 0 || !step4MenuComplete();\n}\n\nfunction renderQR() {\n  const box = $('qr-box');\n  $('bank-name').textContent = CONFIG.BANK.name;\n  $('bank-acc').textContent  = CONFIG.BANK.account;\n  $('bank-holder').textContent = CONFIG.BANK.holder;\n  if (!State.ref) { box.innerHTML = '<span class=\"qr-spin\">' + tr('qr_enter_phone') + '<\u002Fspan>'; return; }\n  const amount = getTotal();\n  const url = 'https:\u002F\u002Fimg.vietqr.io\u002Fimage\u002F' +\n    CONFIG.BANK.bin + '-' + CONFIG.BANK.account + '-compact2.png' +\n    '?amount=' + amount +\n    '&addInfo=' + encodeURIComponent(State.ref) +\n    '&accountName=' + encodeURIComponent(CONFIG.BANK.holder);\n  box.innerHTML = '<img src=\"' + url + '\" alt=\"VietQR\" loading=\"lazy\" onerror=\"this.parentElement.innerHTML=\\'<span class=qr-spin>' + tr('qr_error') + '<\u002Fspan>\\'\">';\n}\n\nfunction renderSummary() {\n  const ev = State.events.find(e => e.id === State.date);\n  const menu = getEventMenu(State.date);\n  const tablesStr = State.selectedTableIds.map(id => {\n    const t = getTable(id);\n    if (!t) return '';\n    if (t.communal) {\n      const n = Number(State.communalPicks[id] || 0);\n      return n + ' ' + tr('seat_word') + ' ' + t.name + ' (' + roomName(t.room) + ')';\n    }\n    return t.name + ' (' + roomName(t.room) + ')';\n  }).join(' + ');\n  const menuLines = State.guestSelections.map((g, i) => {\n    const setObj   = (menu.sets   || []).find(s => s.id === g.set);\n    const drinkObj = (menu.drinks || []).find(d => d.id === g.drink);\n    const parts = [];\n    parts.push(setObj ? setObj.label : '—');\n    if (drinkObj) parts.push(drinkObj.label);\n    return '<div class=\"srow\"><span class=\"sl\">' + tr('guest_n', { n: i+1 }) + '<\u002Fspan><span class=\"sv\">' + parts.join(' · ') + '<\u002Fspan><\u002Fdiv>';\n  }).join('');\n  \u002F\u002F Hiển thị ngày diễn ra (lookup từ ev.date hoặc suy ra từ id), không hiển thị label sự kiện.\n  \u002F\u002F Label thường là tên kiểu 'Fiona & BDchile' → khách đã biết qua banner; ô \"Ngày\" chỉ cần ngày.\n  const isoDate = ev ? getEventDate(ev) : '';\n  const dateText = isoDate ? fmtEventDate(isoDate) : (ev ? ev.label : '—');\n  $('summary').innerHTML =\n    '<div class=\"srow\"><span class=\"sl\">' + tr('date_lbl') + '<\u002Fspan><span class=\"sv\">' + escapeHtml(dateText) + '<\u002Fspan><\u002Fdiv>' +\n    '<div class=\"srow\"><span class=\"sl\">' + tr('table_lbl') + '<\u002Fspan><span class=\"sv\">' + escapeHtml(tablesStr) + '<\u002Fspan><\u002Fdiv>' +\n    '<div class=\"srow\"><span class=\"sl\">' + tr('guests_lbl') + '<\u002Fspan><span class=\"sv\">' + State.qty + ' ' + tr('people') + ' · ' + fmt(getEventPrice()) + '\u002F' + tr('person') + '<\u002Fspan><\u002Fdiv>' +\n    menuLines +\n    '<div class=\"srow\"><span class=\"sl\">' + tr('total_lbl') + '<\u002Fspan><span class=\"sv\" style=\"color:#7a0000;\">' + fmt(getTotal()) + '<\u002Fspan><\u002Fdiv>';\n}\n\n\u002F\u002F === SUBMIT BOOKING =============================================\nasync function submitBooking(btn) {\n  if (btn.disabled) return;\n  btn.
