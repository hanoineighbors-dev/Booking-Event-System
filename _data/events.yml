# Danh sách sự kiện. Trang chủ (mục "Sự kiện") và trang /events/ đều đọc từ đây.
#
# Thêm sự kiện mới: chép một mục bên dưới, sửa nội dung, đặt lên ĐẦU danh sách.
# - kind: one-off  -> sự kiện một đêm. BẮT BUỘC có `end` (giờ kết thúc).
#                     Qua giờ `end`, sự kiện tự chuyển sang mục "Đã diễn ra".
# - kind: series   -> đặt chỗ theo buổi, không có ngày kết thúc cố định.
#                     `live: dragbrunch` = đọc lịch thật từ Google Sheet để báo còn buổi hay không.
# - location: id trong _data/locations.yml
# - Giờ luôn ghi kèm +07:00 (giờ Hà Nội).

